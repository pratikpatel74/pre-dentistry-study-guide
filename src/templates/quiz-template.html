<!doctype html>
<html lang="en" data-theme="dark"><script>try{var _t=localStorage.getItem("theme");if(_t)document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Topic 9 Quiz – Managing Money: Bank Accounts &amp; Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090f;--surface:#111118;--card:#16161e;--border:#2a2a38;--border-hi:#3d3d52;--text:#f0efff;--muted:#8b8aab;--dim:#55546e;--gold:#e8b84b;--gold-bg:rgba(232,184,75,0.10);--accent:#10b981;--accent-bg:rgba(16,185,129,0.12);--correct:#34d399;--correct-bg:rgba(52,211,153,0.12);--wrong:#f87171;--wrong-bg:rgba(248,113,113,0.12);}
[data-theme="light"]{--bg:#f5f4f0;--surface:#eeede8;--card:#fff;--border:#dddbd4;--border-hi:#c8c5bc;--text:#1a1814;--muted:#706c60;--dim:#a09c90;--gold:#b8861a;--gold-bg:rgba(184,134,26,0.08);--accent:#059669;--accent-bg:rgba(5,150,105,0.10);--correct:#059669;--correct-bg:rgba(5,150,105,0.10);--wrong:#dc2626;--wrong-bg:rgba(220,38,38,0.10);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
.topbar{position:sticky;top:0;z-index:50;background:rgba(9,9,15,0.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:52px}
[data-theme="light"] .topbar{background:rgba(245,244,240,0.88)}
.topbar-brand{font-size:0.9rem;font-weight:700;letter-spacing:-0.01em;display:flex;align-items:center;gap:10px}
.topbar-brand span{font-size:0.68rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:2px 8px}
.back-link{font-size:0.78rem;font-weight:600;color:var(--muted);text-decoration:none}
.back-link:hover{color:var(--text)}
.theme-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.timer-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:0 12px;height:34px;cursor:pointer;font-size:0.72rem;font-weight:700;color:var(--muted);white-space:nowrap}
.timer-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.container{max-width:680px;margin:0 auto;padding:48px 20px 80px}
.quiz-header{text-align:center;margin-bottom:40px}
.quiz-eyebrow{font-size:0.68rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.quiz-title{font-size:1.9rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px}
.quiz-sub{color:var(--muted);font-size:0.88rem}
.progress-bar-wrap{background:var(--surface);border-radius:99px;height:6px;margin-bottom:32px;overflow:hidden}
.progress-bar{height:100%;background:var(--accent);border-radius:99px;transition:width 0.4s ease}
.progress-label{display:flex;justify-content:space-between;font-size:0.72rem;color:var(--dim);margin-bottom:8px}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 28px 24px;margin-bottom:20px}
.q-num{font-size:0.68rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.q-timer{font-size:0.8rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.q-timer.warn{color:var(--wrong)}
.q-text{font-size:1.05rem;font-weight:600;line-height:1.45;margin-bottom:22px}
.options{display:flex;flex-direction:column;gap:10px}
.option{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 16px;font-size:0.9rem;font-weight:500;cursor:pointer;text-align:left;color:var(--text);transition:border-color 0.15s,background 0.15s;display:flex;align-items:center;gap:12px}
.option:hover:not(:disabled){border-color:var(--border-hi);background:var(--card)}
.option.correct{border-color:var(--correct);background:var(--correct-bg);color:var(--correct)}
.option.wrong{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong)}
.option:disabled{cursor:default}
.opt-letter{width:24px;height:24px;border-radius:6px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;flex-shrink:0}
.option.correct .opt-letter{background:var(--correct);border-color:var(--correct);color:#fff}
.option.wrong .opt-letter{background:var(--wrong);border-color:var(--wrong);color:#fff}
.feedback{margin-top:14px;padding:12px 16px;border-radius:8px;font-size:0.85rem;font-weight:500;display:none}
.feedback.show{display:block}
.feedback.correct{background:var(--correct-bg);color:var(--correct);border:1px solid var(--correct)}
.feedback.wrong{background:var(--wrong-bg);color:var(--wrong);border:1px solid var(--wrong)}
.key-hint{font-size:0.7rem;color:var(--dim);text-align:right;margin-top:8px}
.actions{display:flex;justify-content:flex-end;margin-top:20px}
.btn-next{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 28px;font-size:0.88rem;font-weight:700;cursor:pointer;display:none}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:40px 28px;text-align:center;display:none}
.result-score{font-size:3.5rem;font-weight:800;letter-spacing:-0.04em;color:var(--accent);line-height:1}
.result-out{font-size:1rem;color:var(--muted);margin:6px 0 4px}
.result-msg{font-size:1.05rem;font-weight:600;margin-bottom:28px}
.result-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn-retry{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent);border-radius:10px;padding:11px 24px;font-size:0.88rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.btn-missed{background:rgba(248,113,113,0.12);color:#f87171;border:1px solid #f87171;border-radius:10px;padding:11px 24px;font-size:0.88rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.btn-hub{background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:10px;padding:11px 24px;font-size:0.88rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-hub:hover{border-color:var(--border-hi);color:var(--text)}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-brand"><span>LO5</span>Bank Accounts &amp; Cards</div>
  <div style="display:flex;align-items:center;gap:8px">
    <button class="timer-btn" id="timer-toggle" onclick="toggleTimer()">⏱ Timer: Off</button>
    <a class="back-link" href="../index.html">← Hub</a>
    <button class="theme-btn" onclick="toggleTheme()">☀️</button>
  </div>
</div>
<div class="container">
  <div class="quiz-header">
    <div class="quiz-eyebrow">Unit 1 · LO5</div>
    <h1 class="quiz-title">Bank Accounts &amp; Cards</h1>
    <p class="quiz-sub">10 questions drawn from a pool of 22 · Press 1–4 to answer, Enter for next</p>
  </div>
  <div class="progress-label"><span id="prog-text">Question 1 of 10</span><span id="prog-score">Score: 0</span></div>
  <div class="progress-bar-wrap"><div class="progress-bar" id="prog-bar" style="width:10%"></div></div>
  <div id="quiz-area"></div>
  <div class="key-hint">Keyboard: 1–4 to answer · Enter or Space to advance</div>
  <div class="actions"><button class="btn-next" id="btn-next" onclick="nextQ()">Next →</button></div>
  <div class="result-card" id="result"></div>
</div>
<script>
const TOPIC_ID='topic9';const DRAW=10;
const POOL=[
  {q:"Which type of bank account is designed for everyday spending and typically includes a debit card and direct debit facility?",opts:["Savings account","Current account","Fixed-rate bond","Cash ISA"],ans:1,exp:"A current account is used for day-to-day transactions — paying bills by direct debit or standing order, receiving salary, and making purchases with a debit card. It is the most common account type and may offer an overdraft facility."},
  {q:"An arranged overdraft differs from an unarranged overdraft in that:",opts:["It always charges a higher interest rate","It has been agreed in advance with the bank, usually with set fees","It can only be used once per year","It is only available on savings accounts"],ans:1,exp:"An arranged (authorised) overdraft is agreed with the bank in advance and has clear terms — an interest rate or daily fee. An unarranged overdraft occurs when spending exceeds the account balance without prior agreement, and usually attracts higher charges or fees under FCA rules."},
  {q:"A basic bank account differs from a standard current account in that:",opts:["It pays a higher interest rate","It cannot be overdrawn and has no credit facilities","It requires a minimum monthly deposit","It is only available to under-18s"],ans:1,exp:"Basic bank accounts are designed for people with poor or no credit history. They allow deposits, debit card payments, and direct debits, but do not offer overdrafts or cheque books. Banks are required to offer them as part of their obligations to financial inclusion."},
  {q:"Which access method allows you to withdraw cash from a bank account at any time without visiting a branch?",opts:["Standing order","ATM (cash machine)","CHAPS payment","Passbook savings"],ans:1,exp:"An ATM (Automated Teller Machine) allows 24/7 cash withdrawal using a debit card and PIN. Most ATMs in the UK are free to use, though some privately operated machines charge a fee (usually displayed before the transaction)."},
  {q:"A standing order differs from a direct debit in that:",opts:["Standing orders are set up by the payee; direct debits by the account holder","Standing orders are set up by the account holder for a fixed amount; direct debits are set up by the payee and can vary","Standing orders always cost more","Direct debits are only for utility bills"],ans:1,exp:"A standing order is a fixed, regular payment set up by the account holder (e.g., £500 rent every month). A direct debit is set up by the payee (e.g., a utility company) and can vary in amount. Both are automatic, but control lies with different parties."},
  {q:"A debit card payment takes money:",opts:["From a line of credit that is repaid monthly","Directly from the account holder's bank balance","From a stored cash balance on the card","From a savings account, not a current account"],ans:1,exp:"A debit card draws funds directly from the current account balance in real time (or within a short processing window). Unlike a credit card, there is no credit involved — you can only spend money you have (unless an overdraft is in place)."},
  {q:"The main advantage of a credit card over a debit card for purchases is:",opts:["Debit cards charge higher fees","Credit cards offer Section 75 protection for purchases between £100 and £30,000","Credit cards always have lower interest rates","Debit cards cannot be used online"],ans:1,exp:"Under Section 75 of the Consumer Credit Act 1974, credit card providers are jointly liable with the retailer if goods/services are faulty or not delivered, for purchases between £100 and £30,000. Debit cards may offer chargeback, but this is a voluntary scheme, not a legal right."},
  {q:"A prepaid card differs from a debit card in that:",opts:["It is linked directly to a current account","It must be loaded with funds in advance and has no link to a bank account","It always carries a credit limit","It can only be used in specific shops"],ans:1,exp:"A prepaid card is loaded with a set amount of money before use, like a plastic version of a voucher. It is not linked to a bank account, so there is no risk of overspending or accessing credit. Common uses include budgeting, travel, and giving to children."},
  {q:"Contactless payments in the UK are limited to a per-transaction limit of:",opts:["£30","£45","£100","There is no limit for cards"],ans:2,exp:"The UK contactless payment limit for individual card transactions is £100 (raised from £45 in October 2021). However, after a set number of contactless transactions, a PIN is required as a security check. Mobile device payments (Apple Pay, Google Pay) have no per-transaction limit."},
  {q:"Which type of account typically offers the highest interest rate but restricts access to funds for a fixed period?",opts:["Current account","Easy-access savings account","Fixed-rate savings bond","Basic bank account"],ans:2,exp:"A fixed-rate bond (or fixed-term savings account) locks away money for a set period (e.g., 1–5 years) in exchange for a guaranteed, higher interest rate. Early withdrawal is usually not allowed or incurs a penalty. Best suited to those who won't need their money during the term."},
  {q:"Which of the following best describes a passbook savings account?",opts:["An online-only account with instant access","A paper-based account where transactions are recorded in a booklet, typically accessed at a branch","An account that links to a mortgage","A current account with a cashback facility"],ans:1,exp:"A passbook savings account uses a physical booklet to record transactions, updated at a branch or ATM. They tend to be simple, low-cost accounts and are often used by people who prefer face-to-face banking or have less access to digital services. Interest rates are often lower than online alternatives."},
  {q:"CHAPS (Clearing House Automated Payment System) is best described as:",opts:["A system for processing cheques within 2 working days","A same-day electronic bank transfer used for high-value payments","A card payment network used in shops","A savings account transfer system"],ans:1,exp:"CHAPS enables same-day guaranteed bank transfers, typically used for large transactions such as property purchases. There is usually a fee (often £15–£35). It is processed in real time on the day of instruction (if submitted by the bank's cut-off time). Faster Payments is used for smaller, quicker transfers."},
  {q:"Faster Payments differs from CHAPS in that:",opts:["Faster Payments is for cheques only","Faster Payments transfers money almost instantly and is typically free, but has lower value limits","Faster Payments takes 3 working days","Faster Payments is only available to businesses"],ans:1,exp:"Faster Payments (FPS) transfers up to £1 million between UK bank accounts almost instantly, usually within seconds, and is free to use. CHAPS is used for larger guaranteed same-day payments and typically charges a fee. Most everyday bank transfers use Faster Payments."},
  {q:"Which of the following is NOT typically a feature of a student bank account?",opts:["An interest-free overdraft up to an agreed limit","A free railcard or other incentive","A higher credit card limit than standard accounts","Access via mobile banking app"],ans:2,exp:"Student accounts commonly offer interest-free overdrafts (a key feature to help manage finances during study), along with perks like railcards or vouchers. They do not typically include higher credit card limits — student accounts are designed for those with limited credit history, not extended credit."},
  {q:"Mobile banking allows customers to:",opts:["Physically deposit cash via their phone","Check balances, make transfers, and pay bills via a smartphone app","Automatically increase their credit limit","Only view statements; no transactions are possible"],ans:1,exp:"Mobile banking apps allow customers to check balances, transfer money, pay bills, set up payees, freeze cards, and more — all from a smartphone. They cannot physically deposit cash (though some banks offer cheque imaging via app). Mobile banking has become the most commonly used banking channel in the UK."},
  {q:"Which statement about internet banking is correct?",opts:["It is available 24/7 but only for viewing statements","It allows full account management including transfers, bill payments, and setting up direct debits","It requires a branch visit to activate each transaction","It is only available to business account holders"],ans:1,exp:"Internet banking provides full account management online — checking balances, making payments, setting up standing orders and direct debits, downloading statements, and more. It is available 24/7. Initial setup usually requires in-branch or postal verification, but ongoing use is entirely online."},
  {q:"A credit union differs from a high-street bank in that:",opts:["Credit unions are run for profit and pay dividends to shareholders","Credit unions are member-owned, not-for-profit organisations that serve a defined community","Credit unions offer the same range of products as a high-street bank","Credit unions are regulated by the PRA only"],ans:1,exp:"Credit unions are mutual, not-for-profit financial cooperatives owned by their members, who share a common bond (e.g., same employer, location, or profession). Profits are returned to members as dividends. They typically offer savings accounts and affordable loans, and are regulated by the FCA and PRA."},
  {q:"Which of the following charges might apply to a current account?",opts:["Annual membership fees only","Monthly maintenance fees, overdraft interest, and fees for returned payments","Transaction fees on every debit card purchase","Capital gains tax on account interest"],ans:1,exp:"Current accounts may charge monthly fees (especially packaged accounts with benefits), overdraft interest (daily fees on arranged/unarranged overdrafts under FCA rules), and fees for returned direct debits or bounced payments. Standard debit card purchases do not incur per-transaction fees in the UK."},
  {q:"A packaged bank account differs from a standard current account in that:",opts:["It has no overdraft facility","It charges a monthly fee in exchange for added benefits such as travel insurance and breakdown cover","It can only be opened by existing mortgage customers","It pays a higher interest rate on savings"],ans:1,exp:"Packaged accounts charge a monthly fee (typically £10–£25) in return for bundled perks such as worldwide travel insurance, mobile phone insurance, and breakdown cover. They offer good value if the benefits are used, but can be poor value if they duplicate existing cover."},
  {q:"The Financial Services Compensation Scheme (FSCS) protects deposits in UK bank accounts up to:",opts:["£50,000 per bank","£85,000 per authorised institution per person","£100,000 per account","£250,000 for joint accounts"],ans:1,exp:"The FSCS protects up to £85,000 per authorised institution per person. If a UK-regulated bank or building society fails, savings up to this limit are automatically compensated. Joint accounts are protected up to £170,000 (£85,000 each). Temporary high balances (e.g., from a house sale) may be protected up to £1 million for 6 months."},
  {q:"Which card type requires the full balance to be paid off each month and does not allow the holder to carry a balance?",opts:["Credit card","Debit card","Charge card","Prepaid card"],ans:2,exp:"A charge card (e.g., traditional American Express) requires the full balance to be settled each month — there is no option to carry debt and pay interest. A credit card allows minimum payments and carries a balance. Charge cards typically have higher fees but no pre-set spending limit."},
  {q:"Branch banking has declined in the UK primarily because:",opts:["Branches are legally required to close after 10 years","The rise of internet and mobile banking has reduced the need for in-person services","The government mandated branch closures","All banking is now done through ATMs only"],ans:1,exp:"The rapid growth of internet and mobile banking has dramatically reduced branch footfall, leading banks to close thousands of branches since the 2010s. This has raised concerns about financial exclusion for elderly and rural customers who rely on branches. The FCA and government have introduced rules requiring banks to assess community impact before closing branches."}
];
POOL.forEach((q,i)=>q._id=i);
let sessionQ=[],cur=0,score=0,answered=false,finished=false;
let timerOn=false,timerSecs=60,timerInterval=null;
const retryMissed=location.search.includes('retry=missed');
try{timerOn=localStorage.getItem(TOPIC_ID+'_timer')==='true';}catch(e){}
function updateTimerBtn(){const b=document.getElementById('timer-toggle');if(!b)return;b.textContent='⏱ Timer: '+(timerOn?'On':'Off');b.className='timer-btn'+(timerOn?' active':'');}
function initSession(){
  let pool;
  if(retryMissed){
    try{const m=JSON.parse(localStorage.getItem(TOPIC_ID+'_missed')||'[]');pool=POOL.filter(q=>m.includes(q._id));}catch(e){pool=[];}
    if(!pool.length)pool=[...POOL];
  }else{
    pool=[...POOL];
    try{localStorage.removeItem(TOPIC_ID+'_missed');}catch(e){}
  }
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  sessionQ=pool.slice(0,Math.min(DRAW,pool.length));
  cur=0;score=0;answered=false;finished=false;
  updateTimerBtn();render();
}
function render(){
  const q=sessionQ[cur];const L=['A','B','C','D'];
  document.getElementById('prog-text').textContent=`Question ${cur+1} of ${sessionQ.length}`;
  document.getElementById('prog-score').textContent=`Score: ${score}`;
  document.getElementById('prog-bar').style.width=`${((cur+1)/sessionQ.length)*100}%`;
  document.getElementById('quiz-area').innerHTML=`<div class="q-card"><div class="q-num"><span>Question ${cur+1}</span>${timerOn?`<span class="q-timer" id="q-timer">${timerSecs}s</span>`:''}</div><div class="q-text">${q.q}</div><div class="options">${q.opts.map((o,i)=>`<button class="option" onclick="pick(${i})" id="opt${i}"><span class="opt-letter">${L[i]}</span>${o}</button>`).join('')}</div><div class="feedback" id="feedback"></div></div>`;
  document.getElementById('btn-next').style.display='none';
  answered=false;
  if(timerOn)startTimer();
}
function startTimer(){
  clearInterval(timerInterval);timerSecs=60;
  timerInterval=setInterval(()=>{
    timerSecs--;
    const el=document.getElementById('q-timer');
    if(el){el.textContent=timerSecs+'s';if(timerSecs<=10)el.classList.add('warn');}
    if(timerSecs<=0){clearInterval(timerInterval);pick(-1);}
  },1000);
}
function pick(i){
  if(answered)return;answered=true;clearInterval(timerInterval);
  const q=sessionQ[cur];const fb=document.getElementById('feedback');
  document.querySelectorAll('.option').forEach(b=>b.disabled=true);
  if(i===q.ans){
    score++;
    if(i>=0)document.getElementById(`opt${i}`).className='option correct';
    fb.className='feedback show correct';fb.textContent='✓ Correct! '+q.exp;
  }else{
    if(i>=0)document.getElementById(`opt${i}`).className='option wrong';
    document.getElementById(`opt${q.ans}`).className='option correct';
    fb.className='feedback show wrong';fb.textContent=(i===-1?'⏱ Time\'s up! ':'✗ ')+q.exp;
    try{const m=JSON.parse(localStorage.getItem(TOPIC_ID+'_missed')||'[]');if(!m.includes(q._id))m.push(q._id);localStorage.setItem(TOPIC_ID+'_missed',JSON.stringify(m));}catch(e){}
  }
  document.getElementById('prog-score').textContent=`Score: ${score}`;
  const nb=document.getElementById('btn-next');nb.style.display='block';nb.textContent=cur<sessionQ.length-1?'Next →':'See Results';
}
function nextQ(){cur++;if(cur>=sessionQ.length){showResult();return;}render();}
function showResult(){
  finished=true;clearInterval(timerInterval);
  document.getElementById('quiz-area').style.display='none';
  document.getElementById('btn-next').style.display='none';
  document.querySelector('.progress-label').style.display='none';
  document.querySelector('.progress-bar-wrap').style.display='none';
  document.querySelector('.key-hint').style.display='none';
  const pct=Math.round((score/sessionQ.length)*100);
  const msg=pct>=80?'Excellent work! 🎉':pct>=60?'Good effort — review the explanations above.':'Keep studying — you\'ve got this!';
  try{localStorage.setItem(TOPIC_ID+'_last',JSON.stringify({score,total:sessionQ.length,pct,date:new Date().toISOString()}));}catch(e){}
  let missedCount=0;try{missedCount=(JSON.parse(localStorage.getItem(TOPIC_ID+'_missed')||'[]')).length;}catch(e){}
  const base=location.href.split('?')[0];
  const r=document.getElementById('result');r.style.display='block';
  r.innerHTML=`<div class="result-score">${score}/${sessionQ.length}</div><div class="result-out">${pct}% correct</div><div class="result-msg">${msg}</div><div class="result-actions"><a class="btn-retry" href="${base}">↺ New Quiz</a>${missedCount>0?`<a class="btn-missed" href="${base}?retry=missed">↯ Retry ${missedCount} missed</a>`:''}<a class="btn-hub" href="../index.html">← Hub</a></div>`;
}
function toggleTimer(){timerOn=!timerOn;try{localStorage.setItem(TOPIC_ID+'_timer',timerOn);}catch(e){}updateTimerBtn();}
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme')||'dark';const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);document.querySelector('.theme-btn').textContent=n==='dark'?'☀️':'🌙';try{localStorage.setItem('theme',n);}catch(e){}}
document.addEventListener('keydown',e=>{
  if(finished)return;
  if(!answered){if(e.key==='1')pick(0);else if(e.key==='2')pick(1);else if(e.key==='3')pick(2);else if(e.key==='4')pick(3);}
  else if((e.key==='Enter'||e.key===' ')&&document.getElementById('btn-next').style.display!=='none'){e.preventDefault();nextQ();}
});
initSession();
</script>
</body>
</html>
