 Judgement", "minutes": 26, "intro": "<p>Rate each response or consideration as a dental student or professional should. Think about patient safety, honesty, confidentiality, teamwork and working within your competence.<\/p><p>Exact answers score 1 mark; answers one step away score ½.<\/p><p>Real pace: about 23 seconds per question.<\/p>", "items": [{"type": "rate", "scale": "app", "stem": "<p>Aisha, a second-year dental student on clinic, notices that a classmate, Tom, has posted a photo on social media of the clinic waiting room. A patient's face is clearly visible in the background.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Aisha speaks to Tom privately and asks him to remove the photo straight away.<\/p>", "ans": 0, "exp": "Quick, discreet action protects the patient's confidentiality and gives Tom the chance to fix it."}, {"type": "rate", "scale": "app", "stem": "<p>Aisha, a second-year dental student on clinic, notices that a classmate, Tom, has posted a photo on social media of the clinic waiting room. A patient's face is clearly visible in the background.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Aisha comments publicly on the post saying it breaches patient confidentiality.<\/p>", "ans": 2, "exp": "The concern is right, but a public comment draws more attention to the patient and humiliates Tom. Raise it privately."}, {"type": "rate", "scale": "app", "stem": "<p>Aisha, a second-year dental student on clinic, notices that a classmate, Tom, has posted a photo on social media of the clinic waiting room. A patient's face is clearly visible in the background.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Aisha ignores it because it's Tom's account and not her responsibility.<\/p>", "ans": 3, "exp": "Everyone has a duty to act when a patient's confidentiality is at risk."}, {"type": "rate", "scale": "app", "stem": "<p>Aisha, a second-year dental student on clinic, notices that a classmate, Tom, has posted a photo on social media of the clinic waiting room. A patient's face is clearly visible in the background.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>If Tom refuses to remove it, Aisha tells the clinical tutor.<\/p>", "ans": 0, "exp": "Escalating is appropriate if the breach continues; patient confidentiality comes first."}, {"type": "rate", "scale": "app", "stem": "<p>Ben is in a group of four dental students preparing a presentation due in two days. One member, Chloe, has not contributed and hasn't replied to messages for a week.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Ben messages Chloe privately, asking if she is OK and whether she can still do her part.<\/p>", "ans": 0, "exp": "Checking in shows concern for her wellbeing and gives her a chance to respond."}, {"type": "rate", "scale": "app", "stem": "<p>Ben is in a group of four dental students preparing a presentation due in two days. One member, Chloe, has not contributed and hasn't replied to messages for a week.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Ben and the others share Chloe's section between them so the work is finished on time.<\/p>", "ans": 1, "exp": "This protects the deadline, but on its own doesn't address why Chloe is absent or make sure she is OK."}, {"type": "rate", "scale": "app", "stem": "<p>Ben is in a group of four dental students preparing a presentation due in two days. One member, Chloe, has not contributed and hasn't replied to messages for a week.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Ben tells the tutor that Chloe is lazy and should fail.<\/p>", "ans": 3, "exp": "Making judgements without knowing the facts is unprofessional and unfair."}, {"type": "rate", "scale": "app", "stem": "<p>Ben is in a group of four dental students preparing a presentation due in two days. One member, Chloe, has not contributed and hasn't replied to messages for a week.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Ben emails the tutor about Chloe before trying to contact her himself.<\/p>", "ans": 1, "exp": "Involving the tutor near a deadline is reasonable, but Ben should first try to reach Chloe directly; she may have a good reason."}, {"type": "rate", "scale": "app", "stem": "<p>Daniel, a final-year dental student, is treating a patient under supervision. He realises that he has started preparing the wrong tooth: the upper left first premolar instead of the upper left second premolar. He has removed only a small amount of enamel.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Daniel stops and tells his supervisor immediately.<\/p>", "ans": 0, "exp": "Patient safety and honesty come first. The supervisor can advise on what to do next."}, {"type": "rate", "scale": "app", "stem": "<p>Daniel, a final-year dental student, is treating a patient under supervision. He realises that he has started preparing the wrong tooth: the upper left first premolar instead of the upper left second premolar. He has removed only a small amount of enamel.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Daniel continues on the correct tooth and says nothing, as the damage is minor.<\/p>", "ans": 3, "exp": "Concealing a mistake breaches the duty of candour and puts trust at risk."}, {"type": "rate", "scale": "app", "stem": "<p>Daniel, a final-year dental student, is treating a patient under supervision. He realises that he has started preparing the wrong tooth: the upper left first premolar instead of the upper left second premolar. He has removed only a small amount of enamel.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Daniel explains to the patient what has happened, with his supervisor present.<\/p>", "ans": 0, "exp": "Patients must be told openly when something goes wrong (duty of candour)."}, {"type": "rate", "scale": "app", "stem": "<p>Daniel, a final-year dental student, is treating a patient under supervision. He realises that he has started preparing the wrong tooth: the upper left first premolar instead of the upper left second premolar. He has removed only a small amount of enamel.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Daniel records the incident in the notes but waits until the end of the session to tell his supervisor.<\/p>", "ans": 2, "exp": "Recording it is right, but the supervisor needs to know now: the error affects what happens next for this patient."}, {"type": "rate", "scale": "imp", "stem": "<p>Ella, a dental student, is shadowing at a practice. Between patients she overhears the dentist making a rude joke about a patient's weight to the dental nurse. The patient has already left.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>That the patient did not hear the comment<\/p>", "ans": 2, "exp": "It reduces immediate harm, but disrespectful comments about patients are unprofessional regardless."}, {"type": "rate", "scale": "imp", "stem": "<p>Ella, a dental student, is shadowing at a practice. Between patients she overhears the dentist making a rude joke about a patient's weight to the dental nurse. The patient has already left.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>That Ella is a guest at the practice and the dentist is senior<\/p>", "ans": 1, "exp": "It's sensible to consider how to raise concerns respectfully, but it shouldn't stop her raising them."}, {"type": "rate", "scale": "imp", "stem": "<p>Ella, a dental student, is shadowing at a practice. Between patients she overhears the dentist making a rude joke about a patient's weight to the dental nurse. The patient has already left.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>The need to treat all patients with dignity and respect<\/p>", "ans": 0, "exp": "Respect for patients is a core professional value."}, {"type": "rate", "scale": "imp", "stem": "<p>Ella, a dental student, is shadowing at a practice. Between patients she overhears the dentist making a rude joke about a patient's weight to the dental nurse. The patient has already left.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>Whether the dental nurse laughed at the joke<\/p>", "ans": 3, "exp": "This doesn't change whether the comment was appropriate."}, {"type": "rate", "scale": "app", "stem": "<p>Farah is a first-year dental student. During a busy exam period, a friend offers her a copy of last year's anatomy exam answers, saying lots of students have them. Farah isn't sure whether using them is allowed.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Farah doesn't open the file and plans to mention it to the module lead after the exam.<\/p>", "ans": 1, "exp": "She avoids cheating, which is good, but a possible leak affects fairness for everyone and is better raised before the exam."}, {"type": "rate", "scale": "app", "stem": "<p>Farah is a first-year dental student. During a busy exam period, a friend offers her a copy of last year's anatomy exam answers, saying lots of students have them. Farah isn't sure whether using them is allowed.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Farah uses the answers, since others are using them too.<\/p>", "ans": 3, "exp": "'Everyone is doing it' doesn't make it acceptable; it may be academic misconduct."}, {"type": "rate", "scale": "app", "stem": "<p>Farah is a first-year dental student. During a busy exam period, a friend offers her a copy of last year's anatomy exam answers, saying lots of students have them. Farah isn't sure whether using them is allowed.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Farah declines and revises using the official materials.<\/p>", "ans": 0, "exp": "The safest and most honest choice."}, {"type": "rate", "scale": "app", "stem": "<p>Farah is a first-year dental student. During a busy exam period, a friend offers her a copy of last year's anatomy exam answers, saying lots of students have them. Farah isn't sure whether using them is allowed.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Farah takes the file but promises herself not to open it until after the exam.<\/p>", "ans": 2, "exp": "Not cheating directly, but holding material that may be prohibited is unwise."}, {"type": "rate", "scale": "app", "stem": "<p>George, a dental student on clinic, has an appointment with a patient who arrives 25 minutes late for a 45-minute filling appointment. The next patient is due straight after.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>George explains politely that there isn't enough time and offers to rebook, after checking with his supervisor.<\/p>", "ans": 0, "exp": "Honest, polite and safe; involving the supervisor follows clinic procedure."}, {"type": "rate", "scale": "app", "stem": "<p>George, a dental student on clinic, has an appointment with a patient who arrives 25 minutes late for a 45-minute filling appointment. The next patient is due straight after.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>George rushes the filling to fit it into the remaining time.<\/p>", "ans": 3, "exp": "Rushing clinical work risks patient safety and quality of care."}, {"type": "rate", "scale": "app", "stem": "<p>George, a dental student on clinic, has an appointment with a patient who arrives 25 minutes late for a 45-minute filling appointment. The next patient is due straight after.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>George asks the supervisor whether part of the treatment can be done safely today.<\/p>", "ans": 0, "exp": "This looks for the best outcome for the patient within safe limits."}, {"type": "rate", "scale": "app", "stem": "<p>George, a dental student on clinic, has an appointment with a patient who arrives 25 minutes late for a 45-minute filling appointment. The next patient is due straight after.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>George tells the patient they should have been on time and refuses to see them.<\/p>", "ans": 2, "exp": "Rebooking may be necessary, but a blaming tone is unprofessional; there may be a good reason for lateness."}, {"type": "rate", "scale": "imp", "stem": "<p>Hana, a dental student, notices that her clinical partner Isaac smells strongly of alcohol at the start of a morning clinic session. He says he was out late but feels fine.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>The safety of the patients Isaac is about to treat<\/p>", "ans": 0, "exp": "Patient safety is the overriding priority."}, {"type": "rate", "scale": "imp", "stem": "<p>Hana, a dental student, notices that her clinical partner Isaac smells strongly of alcohol at the start of a morning clinic session. He says he was out late but feels fine.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>Isaac's assurance that he feels fine<\/p>", "ans": 2, "exp": "People affected by alcohol often underestimate it; his view shouldn't decide the matter."}, {"type": "rate", "scale": "imp", "stem": "<p>Hana, a dental student, notices that her clinical partner Isaac smells strongly of alcohol at the start of a morning clinic session. He says he was out late but feels fine.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>Isaac's wellbeing and whether he needs support<\/p>", "ans": 1, "exp": "Important, but secondary to immediate patient safety."}, {"type": "rate", "scale": "imp", "stem": "<p>Hana, a dental student, notices that her clinical partner Isaac smells strongly of alcohol at the start of a morning clinic session. He says he was out late but feels fine.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>That reporting Isaac might damage their friendship<\/p>", "ans": 3, "exp": "Friendship must not outweigh patients' safety."}, {"type": "mc", "stem": "<p>Hana (from the previous scenario) decides to act.<\/p>", "q": "<p>Which is the MOST appropriate action for Hana to take?<\/p>", "opts": ["Tell the clinical supervisor before patients are seen", "Treat Isaac's patients herself without saying anything", "Tell Isaac to drink some coffee and carry on", "Post anonymously in the year group chat about it"], "ans": 0, "exp": "The supervisor can make sure patients are safe and that Isaac is supported."}, {"type": "mc", "stem": "<p>Hana (from the previous scenario) decides to act.<\/p>", "q": "<p>Which is the LEAST appropriate action for Hana to take?<\/p>", "opts": ["Suggest Isaac speaks to the supervisor himself", "Say nothing in case she has misjudged it", "Ask Isaac how much he drank", "Offer to help Isaac seek support later"], "ans": 1, "exp": "Ignoring a potential risk to patients is the least appropriate option."}, {"type": "rate", "scale": "app", "stem": "<p>Jack, a dental student, is taking a medical history. The patient says they don't want to tell a student about their medication and asks to see 'a proper dentist'.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Jack explains his role, that he is supervised, and why the information matters for safe care.<\/p>", "ans": 0, "exp": "Clear explanation may reassure the patient and respects their choice."}, {"type": "rate", "scale": "app", "stem": "<p>Jack, a dental student, is taking a medical history. The patient says they don't want to tell a student about their medication and asks to see 'a proper dentist'.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Jack asks his supervisor to take over without explaining to the patient why the question matters.<\/p>", "ans": 1, "exp": "Getting help is sensible, but Jack misses the chance to explain, which might have reassured the patient."}, {"type": "rate", "scale": "app", "stem": "<p>Jack, a dental student, is taking a medical history. The patient says they don't want to tell a student about their medication and asks to see 'a proper dentist'.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Jack records 'no medication' so the appointment can continue.<\/p>", "ans": 3, "exp": "Falsifying records is dishonest and could put the patient at serious risk."}, {"type": "rate", "scale": "app", "stem": "<p>Jack, a dental student, is taking a medical history. The patient says they don't want to tell a student about their medication and asks to see 'a proper dentist'.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Jack tells the patient they must answer or they cannot be treated.<\/p>", "ans": 2, "exp": "Treatment may indeed depend on it, but presenting it as an ultimatum is coercive and unhelpful."}, {"type": "rate", "scale": "app", "stem": "<p>Kemi is volunteering on a ward as part of a work-experience placement before applying to dentistry. A patient asks her for a glass of water, but she has been told some patients are 'nil by mouth' before surgery.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Kemi checks with a nurse before giving the patient anything.<\/p>", "ans": 0, "exp": "She doesn't know whether the patient can drink, so checking keeps the patient safe."}, {"type": "rate", "scale": "app", "stem": "<p>Kemi is volunteering on a ward as part of a work-experience placement before applying to dentistry. A patient asks her for a glass of water, but she has been told some patients are 'nil by mouth' before surgery.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Kemi gives the patient a small amount, as water is harmless.<\/p>", "ans": 3, "exp": "Water could be dangerous before an anaesthetic; she must not guess."}, {"type": "rate", "scale": "app", "stem": "<p>Kemi is volunteering on a ward as part of a work-experience placement before applying to dentistry. A patient asks her for a glass of water, but she has been told some patients are 'nil by mouth' before surgery.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Kemi tells the patient she can't help and suggests they press the call bell for a nurse.<\/p>", "ans": 1, "exp": "This points the patient to the right person, but finding out for them herself would be more helpful."}, {"type": "rate", "scale": "app", "stem": "<p>Kemi is volunteering on a ward as part of a work-experience placement before applying to dentistry. A patient asks her for a glass of water, but she has been told some patients are 'nil by mouth' before surgery.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Kemi ignores the request because volunteers can't help with care.<\/p>", "ans": 2, "exp": "She shouldn't give water herself, but ignoring the patient is unkind. She should pass the request on."}, {"type": "rate", "scale": "imp", "stem": "<p>Leo, a dental student, is behind with a reflective portfolio due tomorrow. A friend offers to send Leo her portfolio so he can 'get some ideas'.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>That reflective portfolios must reflect Leo's own experiences<\/p>", "ans": 0, "exp": "Reflection must be personal and genuine; copying is misconduct."}, {"type": "rate", "scale": "imp", "stem": "<p>Leo, a dental student, is behind with a reflective portfolio due tomorrow. A friend offers to send Leo her portfolio so he can 'get some ideas'.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>That his friend has offered willingly<\/p>", "ans": 3, "exp": "Her willingness doesn't make copying acceptable."}, {"type": "rate", "scale": "imp", "stem": "<p>Leo, a dental student, is behind with a reflective portfolio due tomorrow. A friend offers to send Leo her portfolio so he can 'get some ideas'.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>Whether he could ask for an extension because of genuine difficulties<\/p>", "ans": 1, "exp": "A legitimate option worth considering if there are real reasons."}, {"type": "rate", "scale": "imp", "stem": "<p>Leo, a dental student, is behind with a reflective portfolio due tomorrow. A friend offers to send Leo her portfolio so he can 'get some ideas'.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>The risk that both students could face fitness-to-practise action<\/p>", "ans": 1, "exp": "Important, but the main point is that copying is dishonest, whatever the consequences."}, {"type": "rate", "scale": "app", "stem": "<p>Maya, a dental student, is helping on a school oral-health visit. A seven-year-old tells her quietly that she often has no breakfast and that her dad 'gets angry a lot'.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Maya listens calmly and tells the lead dentist or the school's safeguarding lead the same day.<\/p>", "ans": 0, "exp": "Possible safeguarding concerns must be passed to the right person promptly."}, {"type": "rate", "scale": "app", "stem": "<p>Maya, a dental student, is helping on a school oral-health visit. A seven-year-old tells her quietly that she often has no breakfast and that her dad 'gets angry a lot'.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Maya promises the child she won't tell anyone.<\/p>", "ans": 3, "exp": "She cannot promise confidentiality when a child may be at risk."}, {"type": "rate", "scale": "app", "stem": "<p>Maya, a dental student, is helping on a school oral-health visit. A seven-year-old tells her quietly that she often has no breakfast and that her dad 'gets angry a lot'.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Maya asks the child detailed questions about her home life.<\/p>", "ans": 2, "exp": "Some reassurance is fine, but investigating isn't her role and could cause distress or affect any later enquiry."}, {"type": "rate", "scale": "app", "stem": "<p>Maya, a dental student, is helping on a school oral-health visit. A seven-year-old tells her quietly that she often has no breakfast and that her dad 'gets angry a lot'.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Maya writes down what the child said, in the child's words, and the time.<\/p>", "ans": 0, "exp": "Accurate notes help those who follow up."}, {"type": "rate", "scale": "app", "stem": "<p>Noah, a dental student, has been feeling low for several weeks. He is struggling to concentrate on clinic and has stopped seeing friends.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Noah speaks to his personal tutor or the university wellbeing service.<\/p>", "ans": 0, "exp": "Seeking support early is the right thing to do."}, {"type": "rate", "scale": "app", "stem": "<p>Noah, a dental student, has been feeling low for several weeks. He is struggling to concentrate on clinic and has stopped seeing friends.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Noah decides to wait until the holidays and see his GP then if he still feels low.<\/p>", "ans": 2, "exp": "Seeing a GP is right, but delaying while he's struggling on clinic risks his wellbeing and possibly patient care."}, {"type": "rate", "scale": "app", "stem": "<p>Noah, a dental student, has been feeling low for several weeks. He is struggling to concentrate on clinic and has stopped seeing friends.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Noah keeps going to clinic and hides how he feels so no one thinks less of him.<\/p>", "ans": 2, "exp": "Understandable, but hiding problems can affect his health and possibly patient care."}, {"type": "rate", "scale": "app", "stem": "<p>Noah, a dental student, has been feeling low for several weeks. He is struggling to concentrate on clinic and has stopped seeing friends.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Noah stops attending clinic without telling anyone.<\/p>", "ans": 3, "exp": "Unexplained absence lets down patients and colleagues and leaves him without support."}, {"type": "rate", "scale": "app", "stem": "<p>Olivia is a dental student treating a patient who becomes angry because the appointment is running 20 minutes late. The patient raises their voice in the waiting room.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Olivia apologises for the wait and explains the reason calmly.<\/p>", "ans": 0, "exp": "Acknowledging the frustration and explaining can defuse the situation."}, {"type": "rate", "scale": "app", "stem": "<p>Olivia is a dental student treating a patient who becomes angry because the appointment is running 20 minutes late. The patient raises their voice in the waiting room.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Olivia raises her own voice so the patient will listen.<\/p>", "ans": 3, "exp": "Escalating makes things worse and is unprofessional."}, {"type": "rate", "scale": "app", "stem": "<p>Olivia is a dental student treating a patient who becomes angry because the appointment is running 20 minutes late. The patient raises their voice in the waiting room.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Olivia moves on to her next task and leaves the receptionist to deal with the upset patient.<\/p>", "ans": 2, "exp": "The receptionist may help, but walking away without acknowledging the patient is likely to make things worse."}, {"type": "rate", "scale": "app", "stem": "<p>Olivia is a dental student treating a patient who becomes angry because the appointment is running 20 minutes late. The patient raises their voice in the waiting room.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Olivia tells the patient they can complain if they're not happy.<\/p>", "ans": 1, "exp": "Patients do have a right to complain, but leading with this can sound dismissive; listening first is better."}, {"type": "rate", "scale": "imp", "stem": "<p>Priya, a dental student, sees a classmate copying answers from another student during an online class test that counts towards the final mark.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>The fairness of the assessment for other students<\/p>", "ans": 0, "exp": "Cheating undermines fairness and the validity of the qualification."}, {"type": "rate", "scale": "imp", "stem": "<p>Priya, a dental student, sees a classmate copying answers from another student during an online class test that counts towards the final mark.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>That the classmate is a close friend of Priya's<\/p>", "ans": 2, "exp": "Friendship may make it harder, but shouldn't decide what's right."}, {"type": "rate", "scale": "imp", "stem": "<p>Priya, a dental student, sees a classmate copying answers from another student during an online class test that counts towards the final mark.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>That dentists need to be honest and trustworthy<\/p>", "ans": 0, "exp": "Honesty is central to professionalism."}, {"type": "rate", "scale": "imp", "stem": "<p>Priya, a dental student, sees a classmate copying answers from another student during an online class test that counts towards the final mark.<\/p>", "q": "<p><b>How important is this to take into account?<\/b><\/p><p>Whether the test is worth only a small percentage of the module<\/p>", "ans": 2, "exp": "Even small-scale dishonesty matters professionally."}, {"type": "rate", "scale": "app", "stem": "<p>Quinn, a dental student, accidentally sends an email containing a patient's name and treatment plan to the wrong student.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Quinn tells their supervisor straight away.<\/p>", "ans": 0, "exp": "Data breaches must be reported promptly so they can be managed."}, {"type": "rate", "scale": "app", "stem": "<p>Quinn, a dental student, accidentally sends an email containing a patient's name and treatment plan to the wrong student.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Quinn asks the other student to delete the email and confirm they've done so.<\/p>", "ans": 1, "exp": "Sensible, but it should be done alongside reporting, not instead of it."}, {"type": "rate", "scale": "app", "stem": "<p>Quinn, a dental student, accidentally sends an email containing a patient's name and treatment plan to the wrong student.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Quinn says nothing because the other student is also a dental student.<\/p>", "ans": 3, "exp": "It's still a breach of confidentiality and must be reported."}, {"type": "rate", "scale": "app", "stem": "<p>Quinn, a dental student, accidentally sends an email containing a patient's name and treatment plan to the wrong student.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Quinn follows the clinic's data breach procedure.<\/p>", "ans": 0, "exp": "Following procedure ensures the right steps are taken."}, {"type": "rate", "scale": "app", "stem": "<p>Ravi, a dental student on placement, is asked by a patient to recommend a private cosmetic treatment that the patient saw advertised online. Ravi doesn't know much about it.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Ravi says he isn't sure and offers to ask his supervisor.<\/p>", "ans": 0, "exp": "Honest about the limits of his knowledge."}, {"type": "rate", "scale": "app", "stem": "<p>Ravi, a dental student on placement, is asked by a patient to recommend a private cosmetic treatment that the patient saw advertised online. Ravi doesn't know much about it.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Ravi gives his opinion based on what he's seen on social media.<\/p>", "ans": 3, "exp": "Advice outside his competence, based on unreliable sources, could mislead the patient."}, {"type": "rate", "scale": "app", "stem": "<p>Ravi, a dental student on placement, is asked by a patient to recommend a private cosmetic treatment that the patient saw advertised online. Ravi doesn't know much about it.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Ravi tells the patient to look it up online.<\/p>", "ans": 2, "exp": "Not harmful in itself, but unhelpful and may lead to poor information."}, {"type": "rate", "scale": "app", "stem": "<p>Ravi, a dental student on placement, is asked by a patient to recommend a private cosmetic treatment that the patient saw advertised online. Ravi doesn't know much about it.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Ravi suggests the patient discusses it with the dentist at their next appointment.<\/p>", "ans": 1, "exp": "Appropriate, but involving his supervisor now would be better."}, {"type": "rate", "scale": "app", "stem": "<p>Sofia, a dental student, has been asked by a patient she treated to connect with her on social media and to meet for coffee.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Sofia politely declines, explaining she keeps professional boundaries with patients.<\/p>", "ans": 0, "exp": "Maintaining professional boundaries protects patients and clinicians."}, {"type": "rate", "scale": "app", "stem": "<p>Sofia, a dental student, has been asked by a patient she treated to connect with her on social media and to meet for coffee.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Sofia accepts the friend request but declines the coffee.<\/p>", "ans": 2, "exp": "Less serious than meeting, but social media links still blur boundaries."}, {"type": "rate", "scale": "app", "stem": "<p>Sofia, a dental student, has been asked by a patient she treated to connect with her on social media and to meet for coffee.<\/p>", "q": "<p><b>How appropriate is this response?<\/b><\/p><p>Sofia meets the patient, since she's only a student.<\/p>", "ans": 3, "exp": "Students are held to professional standards with patients."}]}]};
const LETTERS = ['A','B','C','D','E'];
const SJT_APP = ['Very appropriate','Appropriate, but not ideal','Inappropriate, but not awful','Very inappropriate'];
const SJT_IMP = ['Very important','Important','Of minor importance','Not important at all'];
let state = {phase:'start', sec:0, idx:0, answers:[], flags:[], timeLeft:0, timer:null, factor:1, timed:TEST.mode==='test', checked:{}};
const app = document.getElementById('app');
const NSETS = TEST.sections.reduce((a,s)=>Math.max(a,(s.variants||[]).length),1);
function loadSet(v){ TEST.setNo=((v%NSETS)+NSETS)%NSETS; TEST.sections.forEach(s=>{ if(s.variants) s.items=s.variants[TEST.setNo%s.variants.length]; }); try{localStorage.setItem('ucat_'+TEST.id+'_set',String(TEST.setNo));}catch(e){} }
(function(){ let v=0; try{ v=parseInt(localStorage.getItem('ucat_'+TEST.id+'_set')||'0',10)||0; }catch(e){} loadSet(v); })();
function newSet(){ clearInterval(state.timer); loadSet(TEST.setNo+1); state.checked={}; state.idx=0; state.phase='start'; render(); window.scrollTo(0,0); }

function esc(s){return String(s);}
function fmt(t){if(t<0)t=0;const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+String(s).padStart(2,'0');}
function sec(){return TEST.sections[state.sec];}
function item(){return sec().items[state.idx];}
function key(si,ii){return si+'_'+ii;}
function scaleFor(it){return it.scale==='imp'?SJT_IMP:SJT_APP;}

function render(){
  document.getElementById('calc-btn').classList.toggle('hidden', !(state.phase==='q' && sec().key==='qr'));
  if(state.phase!=='q'){document.getElementById('calc').classList.remove('show');}
  document.getElementById('nav').classList.toggle('hidden', state.phase!=='q');
  document.getElementById('timer').classList.toggle('hidden', !(state.phase==='q' && state.timed));
  if(state.phase==='start') return renderStart();
  if(state.phase==='intro') return renderIntro();
  if(state.phase==='q') return renderQ();
  if(state.phase==='results') return renderResults();
  if(state.phase==='review') return renderReview();
}

function renderStart(){
  const rows = TEST.sections.map(s=>`<tr><td>${s.name}</td><td>${s.items.length}</td><td>${TEST.mode==='test'?s.minutes+' min':'Untimed'}</td></tr>`).join('');
  const total = TEST.sections.reduce((a,s)=>a+s.minutes,0);
  const timing = TEST.mode==='test' ? `
    <h2>Timing</h2>
    <div class="choices">
      <button class="pill on" data-f="1" onclick="setFactor(this,1)">Standard</button>
      <button class="pill" data-f="1.25" onclick="setFactor(this,1.25)">+25% (UCATSEN)</button>
      <button class="pill" data-f="0" onclick="setFactor(this,0)">Untimed</button>
    </div>
    <p class="muted" style="font-size:0.85rem">Standard total: ${total} minutes of questions. Each section has its own clock; when it runs out you move on, as in the real test.</p>` :
    `<p class="muted">Untimed drill: you get the answer and explanation straight after each question.</p>`;
  app.innerHTML = `<div class="narrow">
    <div class="eyebrow">${TEST.kind}</div>
    <h1>${TEST.title}</h1>
    <p class="muted">${TEST.blurb}</p>
    <div class="card" style="margin-top:20px">
      <table class="info"><tr><th>Section</th><th>Questions</th><th>Time</th></tr>${rows}</table>
      ${timing}
      ${NSETS>1?`<div class="setbar"><span>Question set <b>${TEST.setNo+1} of ${NSETS}</b></span><button class="btn btn-ghost" onclick="newSet()">New set ↻</button></div>`:''}
      <p style="font-size:0.82rem" class="muted">Original practice questions in UCAT style, not official UCAT content. Scores here are raw marks, not UCAT scaled scores.</p>
      <div style="margin-top:16px"><button class="btn btn-primary" onclick="begin()">Start →</button></div>
    </div></div>`;
}
function setFactor(el,f){state.factor=f;state.timed=f>0;document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('on',b===el));}
function begin(){state.answers=TEST.sections.map(s=>s.items.map(()=>null));state.flags=TEST.sections.map(s=>s.items.map(()=>false));state.sec=0;state.phase='intro';render();}

function renderIntro(){
  const s=sec();
  const time = state.timed ? `${Math.round(s.minutes*state.factor*10)/10} minutes` : 'Untimed';
  app.innerHTML = `<div class="narrow"><div class="card">
    <div class="secname">Section ${state.sec+1} of ${TEST.sections.length}</div>
    <h1 style="margin-top:6px">${s.name}</h1>
    <p class="muted" style="margin-bottom:12px">${s.items.length} questions · ${time}</p>
    <div style="font-size:0.92rem">${s.intro}</div>
    <div style="margin-top:20px"><button class="btn btn-primary" onclick="startSection()">Start section →</button></div>
  </div></div>`;
}
function startSection(){
  state.idx=0;state.phase='q';
  clearInterval(state.timer);
  if(state.timed){
    state.timeLeft=Math.round(sec().minutes*60*state.factor);
    const t=document.getElementById('timer');
    const tick=()=>{t.textContent='⏱ '+fmt(state.timeLeft);t.classList.toggle('warn',state.timeLeft<=60);
      if(state.timeLeft<=0){clearInterval(state.timer);endSection(true);} state.timeLeft--;};
    tick();state.timer=setInterval(tick,1000);
  }
  render();window.scrollTo(0,0);
}

function optButtons(it, chosen, reveal){
  return it.opts.map((o,i)=>{
    let cls='opt';
    if(reveal){ if(i===it.ans) cls+=' ok'; else if(i===chosen) cls+=(it.type==='rate'&&Math.abs(i-it.ans)===1?' part':' bad'); }
    else if(i===chosen) cls+=' sel';
    return `<button class="${cls}" ${reveal?'disabled':''} onclick="pick(${i})"><span class="letter">${LETTERS[i]}</span><span>${o}</span></button>`;
  }).join('');
}
function ynTable(it, chosen, reveal){
  return `<table class="yn">${it.statements.map((st,i)=>{
    const c=chosen?chosen[i]:null;
    const b=(v,lab)=>{let cls='ynb';
      if(reveal){ if(it.answers[i]===v) cls+=' ok'; else if(c===v) cls+=' bad'; }
      else if(c===v) cls+=' sel';
      return `<button class="${cls}" ${reveal?'disabled':''} onclick="pickYN(${i},${v})">${lab}</button>`;};
    return `<tr><td>${st}</td><td class="c">${b(true,'Yes')}</td><td class="c">${b(false,'No')}</td></tr>`;}).join('')}</table>`;
}
function itemOpts(it){ if(it.type==='rate'){ it.opts = scaleFor(it); } return it; }

function renderQ(){
  const s=sec(), it=itemOpts(item()), k=key(state.sec,state.idx);
  const chosen=state.answers[state.sec][state.idx];
  const reveal = TEST.mode==='drill' && state.checked[k];
  let body = it.type==='yn' ? ynTable(it, chosen, reveal) : `<div class="opts">${optButtons(it, chosen, reveal)}</div>`;
  let fb='';
  if(reveal){ const m=markItem(it,chosen); const lab=m.full?'<b class="ok">Correct.</b>':(m.got>0?'<b class="part">Partly right.</b>':'<b class="bad">Not quite.</b>');
    fb=`<div class="feedback">${lab} ${it.exp}</div>`; }
  const check = TEST.mode==='drill' && !reveal ? `<div style="margin-top:14px"><button class="btn btn-primary" ${answered(it,chosen)?'':'disabled'} onclick="checkIt()">Check answer</button></div>` : '';
  const stem = it.stem ? `<div class="stem">${it.stem}</div>` : '';
  app.innerHTML = `
    <div class="qhead"><div><span class="secname">${s.name}</span></div><div class="qnum">Question ${state.idx+1} of ${s.items.length}${state.flags[state.sec][state.idx]?' · ⚑ flagged':''}</div></div>
    <div class="split ${it.stem?'':'single'}">${stem}
      <div class="qcard"><div class="qtext">${it.q}</div>${body}${check}${fb}</div>
    </div>`;
  document.getElementById('prev').disabled = state.idx===0;
  document.getElementById('next').textContent = state.idx===s.items.length-1 ? 'End section →' : 'Next →';
  document.getElementById('flag').classList.toggle('on', state.flags[state.sec][state.idx]);
}
function answered(it,c){ if(c===null||c===undefined) return false; if(it.type==='yn') return c.every(v=>v!==null); return true; }
function pick(i){ const k=key(state.sec,state.idx); if(TEST.mode==='drill'&&state.checked[k]) return; state.answers[state.sec][state.idx]=i; renderQ(); }
function pickYN(i,v){ const k=key(state.sec,state.idx); if(TEST.mode==='drill'&&state.checked[k]) return; const it=item();
  let c=state.answers[state.sec][state.idx]; if(!c) c=it.statements.map(()=>null); c[i]=v; state.answers[state.sec][state.idx]=c; renderQ(); }
function checkIt(){ state.checked[key(state.sec,state.idx)]=true; renderQ(); }
function toggleFlag(){ state.flags[state.sec][state.idx]=!state.flags[state.sec][state.idx]; renderQ(); }
function go(d){ const n=state.idx+d; if(n<0) return; if(n>=sec().items.length){ confirmEnd(); return; } state.idx=n; renderQ(); window.scrollTo(0,0); }
function confirmEnd(){
  const s=sec(); const unanswered=s.items.filter((it,i)=>!answered(itemOpts(it),state.answers[state.sec][i])).length;
  const msg = state.timed ? `You still have ${fmt(state.timeLeft)} left.` : '';
  showModal(`<h2 style="margin-top:0">End ${s.name}?</h2><p class="muted">${unanswered? unanswered+' question(s) unanswered. ':''}${msg} You can't come back to this section.</p>
    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn btn-primary" onclick="hideModal();endSection(false)">End section</button><button class="btn btn-ghost" onclick="hideModal()">Keep going</button></div>`);
}
function endSection(timeout){
  clearInterval(state.timer);
  if(timeout){ showModal(`<h2 style="margin-top:0">Time's up</h2><p class="muted">${sec().name} has ended.</p><div style="margin-top:14px"><button class="btn btn-primary" onclick="hideModal();nextSection()">Continue</button></div>`); return; }
  nextSection();
}
function nextSection(){ if(state.sec<TEST.sections.length-1){ state.sec++; state.phase='intro'; } else { state.phase='results'; saveResult(); } render(); window.scrollTo(0,0); }
function openNavigator(){
  const s=sec();
  const cells=s.items.map((it,i)=>{const a=answered(itemOpts(it),state.answers[state.sec][i]);return `<button class="gq ${a?'ans':''} ${state.flags[state.sec][i]?'flag':''}" onclick="hideModal();state.idx=${i};renderQ();window.scrollTo(0,0)">${i+1}</button>`;}).join('');
  showModal(`<h2 style="margin-top:0">${s.name}</h2><p class="muted" style="font-size:0.85rem">Blue = answered · ⚑ = flagged</p><div class="grid">${cells}</div><div style="display:flex;gap:10px"><button class="btn btn-ghost" onclick="hideModal()">Close</button><button class="btn btn-primary" onclick="hideModal();confirmEnd()">End section</button></div>`);
}
function showModal(h){document.getElementById('modal-body').innerHTML=h;document.getElementById('modal').classList.add('show');}
function hideModal(){document.getElementById('modal').classList.remove('show');}

// Marking: mc = 1; yn (Decision Making multi-statement) = 2, or 1 with one mistake; rate (SJT) = 1, or 0.5 if one step away.
function markItem(it,c){
  if(it.type==='yn'){ const max=2; if(!c) return {got:0,max,full:false}; const wrong=it.statements.reduce((a,_,i)=>a+(c[i]!==it.answers[i]?1:0),0); const got=wrong===0?2:(wrong===1?1:0); return {got,max,full:got===2}; }
  if(it.type==='rate'){ if(c===null||c===undefined) return {got:0,max:1,full:false}; const d=Math.abs(c-it.ans); return {got:d===0?1:(d===1?0.5:0),max:1,full:d===0}; }
  return {got:c===it.ans?1:0,max:1,full:c===it.ans};
}
function results(){
  return TEST.sections.map((s,si)=>{let got=0,max=0;s.items.forEach((it,ii)=>{const m=markItem(itemOpts(it),state.answers[si][ii]);got+=m.got;max+=m.max;});return {name:s.name,key:s.key,got,max};});
}
function saveResult(){ try{ const r=results(); const rec={date:new Date().toISOString(), set:(TEST.setNo||0)+1, sections:r};
  localStorage.setItem('ucat_'+TEST.id+'_last', JSON.stringify(rec));
  let h=[]; try{ h=JSON.parse(localStorage.getItem('ucat_'+TEST.id+'_hist')||'[]'); }catch(e){} h.push(rec); localStorage.setItem('ucat_'+TEST.id+'_hist', JSON.stringify(h.slice(-50))); }catch(e){} }
function renderResults(){
  const r=results();
  const rows=r.map(x=>{const pct=x.max?Math.round(100*x.got/x.max):0;return `<div class="score-row"><div style="flex:1"><b>${x.name}</b><div class="bar"><i style="width:${pct}%"></i></div></div><div style="margin-left:18px;text-align:right;min-width:90px"><b>${Math.round(x.got*10)/10} / ${x.max}</b><div class="muted" style="font-size:0.8rem">${pct}%</div></div></div>`;}).join('');
  app.innerHTML=`<div class="narrow"><div class="eyebrow">Results</div><h1>${TEST.title}</h1>
   <div class="card" style="margin-top:16px">${rows}
   <p class="muted" style="font-size:0.82rem;margin-top:14px">Raw marks only. Real UCAT scores are scaled (300–900 per cognitive subtest; SJT in bands), so these percentages can't be converted exactly. Decision Making multi-statement items score 2 (or 1 with one slip); Situational Judgement ratings score 1 (or ½ if one step away).</p>
   <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
    <button class="btn btn-primary" onclick="state.phase='review';state.reviewWrongOnly=false;render()">Review answers</button>
    <button class="btn btn-ghost" onclick="state.phase='review';state.reviewWrongOnly=true;render()">Review mistakes</button>
    <button class="btn btn-ghost" onclick="location.reload()">Try again</button>
    ${NSETS>1?'<button class="btn btn-ghost" onclick="newSet()">New set ↻</button>':''}
    <a class="btn btn-ghost" href="index.html">← UCAT practice</a></div></div></div>`;
}
function renderReview(){
  let html=`<div class="narrow"><div class="eyebrow">Review</div><h1>${state.reviewWrongOnly?'Your mistakes':'All answers'}</h1>
    <p style="margin:8px 0 18px"><button class="btn btn-ghost" onclick="state.phase='results';render()">← Results</button></p>`;
  TEST.sections.forEach((s,si)=>{
    html+=`<h2>${s.name}</h2>`;
    let shown=0;
    s.items.forEach((raw,ii)=>{
      const it=itemOpts(raw), c=state.answers[si][ii], m=markItem(it,c);
      if(state.reviewWrongOnly && m.full) return; shown++;
      const tag=m.full?'<span class="tag ok">Correct</span>':(m.got>0?'<span class="tag part">Partial</span>':(answered(it,c)?'<span class="tag bad">Wrong</span>':'<span class="tag bad">Not answered</span>'));
      const body = it.type==='yn' ? ynTable(it,c,true) : `<div class="opts">${optButtons(it,c,true)}</div>`;
      html+=`<div class="review-item"><div class="qhead"><span class="qnum">Question ${ii+1}</span>${tag}</div>
        ${it.stem?`<details><summary>Show passage / data</summary><div class="stem" style="margin-top:10px;max-height:none">${it.stem}</div></details>`:''}
        <div class="qtext" style="margin-top:10px">${it.q}</div>${body}<div class="feedback">${it.exp}</div></div>`;
    });
    if(!shown) html+=`<p class="muted">Nothing to review here. 🎉</p>`;
  });
  app.innerHTML=html+'</div>'; window.scrollTo(0,0);
}

// Calculator
let calc={cur:'0',acc:null,op:null,fresh:false};
function toggleCalc(){document.getElementById('calc').classList.toggle('show');}
function cshow(){document.getElementById('cdisp').textContent=calc.cur;}
function capply(a,b,op){a=parseFloat(a);b=parseFloat(b);let r= op==='+'?a+b: op==='-'?a-b: op==='*'?a*b: op==='/'?(b===0?NaN:a/b): b; return String(Math.round(r*1e10)/1e10);}
function ck(k){
  if(/^[0-9]$/.test(k)){ calc.cur=(calc.fresh||calc.cur==='0')?k:calc.cur+k; calc.fresh=false; }
  else if(k==='.'){ if(calc.fresh){calc.cur='0.';calc.fresh=false;} else if(!calc.cur.includes('.')) calc.cur+='.'; }
  else if(k==='C'){ calc={cur:'0',acc:null,op:null,fresh:false}; }
  else if(k==='back'){ calc.cur=calc.cur.length>1?calc.cur.slice(0,-1):'0'; }
  else if(k==='neg'){ calc.cur=String(-parseFloat(calc.cur)); }
  else if(k==='%'){ calc.cur=String(parseFloat(calc.cur)/100); }
  else if('+-*/'.includes(k)){ if(calc.op&&!calc.fresh){ calc.acc=capply(calc.acc,calc.cur,calc.op); calc.cur=calc.acc; } else calc.acc=calc.cur; calc.op=k; calc.fresh=true; }
  else if(k==='='){ if(calc.op){ calc.cur=capply(calc.acc,calc.cur,calc.op); calc.op=null; calc.acc=null; calc.fresh=true; } }
  cshow();
}
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme')||'dark';const n=c==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);document.querySelector('.theme-btn').textContent=n==='dark'?'☀️':'🌙';try{localStorage.setItem('theme',n);}catch(e){}}
try{if(document.documentElement.getAttribute('data-theme')==='light')document.querySelector('.theme-btn').textContent='🌙';}catch(e){}
document.addEventListener('keydown',e=>{ if(state.phase!=='q'||document.getElementById('modal').classList.contains('show')) return;
  const it=item(); if(it.type!=='yn'&&/^[1-5]$/.test(e.key)){ const i=+e.key-1; if(i<itemOpts(it).opts.length) pick(i); }
  else if(e.key==='ArrowRight') go(1); else if(e.key==='ArrowLeft') go(-1); });
window.addEventListener('beforeunload',e=>{ if(state.phase==='q'||state.phase==='intro'){ e.preventDefault(); e.returnValue=''; } });
render();
</script>
