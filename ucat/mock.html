<title>Full UCAT mock – UCAT practice</title>

<style>
:root{--bg:#09090f;--surface:#111118;--card:#16161e;--border:#2a2a38;--border-hi:#3d3d52;--text:#f0efff;--muted:#8b8aab;--dim:#55546e;--gold:#e8b84b;--gold-bg:rgba(232,184,75,0.10);--accent:#38bdf8;--accent-bg:rgba(56,189,248,0.12);--ok:#34d399;--ok-bg:rgba(52,211,153,0.12);--bad:#f87171;--bad-bg:rgba(248,113,113,0.12);--part:#fbbf24;--part-bg:rgba(251,191,36,0.12)}
[data-theme="light"]{--bg:#f5f4f0;--surface:#eeede8;--card:#fff;--border:#dddbd4;--border-hi:#c8c5bc;--text:#1a1814;--muted:#706c60;--dim:#a09c90;--gold:#b8861a;--gold-bg:rgba(184,134,26,0.08);--accent:#0284c7;--accent-bg:rgba(2,132,199,0.10);--ok:#059669;--ok-bg:rgba(5,150,105,0.10);--bad:#dc2626;--bad-bg:rgba(220,38,38,0.10);--part:#b45309;--part-bg:rgba(180,83,9,0.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55}
button{font-family:inherit}
.topbar{position:sticky;top:0;z-index:50;background:rgba(9,9,15,0.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;gap:10px}
[data-theme="light"] .topbar{background:rgba(245,244,240,0.92)}
.brand{font-size:0.88rem;font-weight:700;display:flex;align-items:center;gap:10px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:0.66rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:2px 8px}
.tb-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.pill{background:var(--surface);border:1px solid var(--border);border-radius:8px;height:34px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:0.78rem;font-weight:700;color:var(--muted);cursor:pointer;text-decoration:none;white-space:nowrap}
.pill:hover{border-color:var(--border-hi);color:var(--text)}
.pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.timer{font-variant-numeric:tabular-nums;color:var(--accent);cursor:default}
.timer.warn{color:var(--bad);border-color:var(--bad)}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 120px}
.narrow{max-width:720px;margin:0 auto}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-0.03em;margin-bottom:8px}
h2{font-size:1.15rem;font-weight:700;margin:22px 0 10px}
.eyebrow{font-size:0.68rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px}
table.info{width:100%;border-collapse:collapse;margin:12px 0 18px;font-size:0.9rem}
table.info th,table.info td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
table.info th{font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--dim)}
.choices{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 22px;border-radius:10px;font-size:0.9rem;font-weight:700;cursor:pointer;border:1px solid transparent;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-ghost{background:var(--surface);color:var(--muted);border-color:var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border-hi)}
.btn[disabled]{opacity:0.4;cursor:default}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.qnum{font-size:0.72rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--dim)}
.secname{font-size:0.72rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent)}
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:start}
.split.single{grid-template-columns:1fr;max-width:760px;margin:0 auto}
@media(max-width:860px){.split{grid-template-columns:1fr}}
.stem{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;font-size:0.93rem;max-height:70vh;overflow:auto}
.stem p{margin-bottom:10px}
.stem table{border-collapse:collapse;width:100%;font-size:0.86rem;margin:8px 0}
.stem th,.stem td{border:1px solid var(--border);padding:6px 8px;text-align:left}
.stem th{background:var(--surface);font-weight:600}
.stem svg{max-width:100%;height:auto}
.stem svg text{fill:var(--text);font-family:inherit}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px}
.qtext{font-size:1rem;font-weight:600;margin-bottom:16px}
.qtext p{margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:0.92rem;text-align:left;color:var(--text);cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not([disabled]){border-color:var(--border-hi)}
.opt.sel{border-color:var(--accent);background:var(--accent-bg)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.part{border-color:var(--part);background:var(--part-bg)}
.opt[disabled]{cursor:default}
.letter{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex-shrink:0;background:var(--card)}
.yn{width:100%;border-collapse:collapse;font-size:0.9rem}
.yn td{padding:9px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.yn td.c{width:76px;text-align:center}
.ynb{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 0;width:64px;cursor:pointer;font-weight:700;font-size:0.8rem}
.ynb.sel{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.ynb.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.ynb.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.feedback{margin-top:16px;border-radius:10px;padding:12px 14px;font-size:0.88rem;border:1px solid var(--border);background:var(--surface)}
.feedback b.ok{color:var(--ok)}.feedback b.bad{color:var(--bad)}.feedback b.part{color:var(--part)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:40}
.nav .mid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin:14px 0}
.gq{height:40px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;cursor:pointer;position:relative;font-size:0.82rem}
.gq.ans{background:var(--accent-bg);border-color:var(--accent)}
.gq.flag::after{content:'⚑';position:absolute;top:-6px;right:-4px;color:var(--gold);font-size:0.8rem}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.show{display:flex}
.modal .card{max-width:640px;width:100%;max-height:85vh;overflow:auto}
.calc{position:fixed;right:20px;bottom:84px;width:236px;background:var(--card);border:1px solid var(--border-hi);border-radius:14px;padding:12px;z-index:55;display:none;box-shadow:0 12px 40px rgba(0,0,0,0.35)}
.calc.show{display:block}
.calc .disp{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;text-align:right;font-variant-numeric:tabular-nums;font-size:1.15rem;margin-bottom:8px;overflow:hidden;white-space:nowrap}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc button{height:38px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;cursor:pointer}
.calc button.op{color:var(--accent)}
.score-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);align-items:center}
.bar{height:8px;background:var(--surface);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.review-item{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--card)}
.review-item details summary{cursor:pointer;color:var(--accent);font-size:0.85rem;font-weight:600;margin-top:8px}
.tag{font-size:0.68rem;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:0.04em}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.part{background:var(--part-bg);color:var(--part)}
.hidden{display:none!important}
@media(max-width:600px){.nav .mid .hide-sm{display:none}.wrap{padding:20px 14px 130px}.brand{font-size:0.8rem}.brand b{display:none}.stem{max-height:42vh}}
.setbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0 4px;padding:10px 12px;border:1px dashed var(--border);border-radius:10px;font-size:0.9rem}
</style>

<script>
const TEST = {"id": "mock", "title": "Full UCAT mock", "kind": "Full-length mock", "blurb": "All four subtests in order with real timings: 184 questions in 111 minutes, then a full review. 3 versions of the Decision Making and Quantitative Reasoning sections.", "mode": "test", "sections": [{"key": "vr", "name": "Verbal Reasoning", "minutes": 22, "intro": "<p>Read each passage and answer using <b>only the information in the passage<\/b>, not your own knowledge.<\/p><p><b>True<\/b>: the passage says or clearly implies it. <b>False<\/b>: the passage contradicts it. <b>Can't tell<\/b>: the passage doesn't give enough information.<\/p><p>Real pace: about 30 seconds per question, including reading.<\/p>", "items": [{"type": "mc", "stem": "<p><b>Anaesthesia's dental origins<\/b><\/p>\n<p>Before the 1840s, surgery was performed on conscious patients, and speed was the surgeon's most prized skill. The first steps towards pain-free surgery came not from a hospital but from dentistry. In 1844 Horace Wells, a dentist in Connecticut, noticed that a man injured while under the influence of nitrous oxide, then popular as an entertainment known as 'laughing gas', seemed to feel no pain. Wells had one of his own teeth removed under the gas the next day and reported feeling nothing.<\/p>\n<p>Wells's public demonstration in Boston the following year went badly: the patient cried out, and the audience declared the method a fraud. The patient later said he had felt little, but the damage to Wells's reputation was done. In October 1846, William Morton, a former associate of Wells, used ether during an operation at Massachusetts General Hospital. This demonstration was judged a success, and news of it spread to Europe within months.<\/p>\n<p>The question of who deserved credit led to bitter disputes. Several men, including Wells and Morton, claimed priority, and none of them profited greatly from the discovery.<\/p>", "q": "<p>Horace Wells tested nitrous oxide on himself before demonstrating it publicly.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 0, "exp": "The passage says Wells had his own tooth removed under the gas before the Boston demonstration."}, {"type": "mc", "stem": "<p><b>Anaesthesia's dental origins<\/b><\/p>\n<p>Before the 1840s, surgery was performed on conscious patients, and speed was the surgeon's most prized skill. The first steps towards pain-free surgery came not from a hospital but from dentistry. In 1844 Horace Wells, a dentist in Connecticut, noticed that a man injured while under the influence of nitrous oxide, then popular as an entertainment known as 'laughing gas', seemed to feel no pain. Wells had one of his own teeth removed under the gas the next day and reported feeling nothing.<\/p>\n<p>Wells's public demonstration in Boston the following year went badly: the patient cried out, and the audience declared the method a fraud. The patient later said he had felt little, but the damage to Wells's reputation was done. In October 1846, William Morton, a former associate of Wells, used ether during an operation at Massachusetts General Hospital. This demonstration was judged a success, and news of it spread to Europe within months.<\/p>\n<p>The question of who deserved credit led to bitter disputes. Several men, including Wells and Morton, claimed priority, and none of them profited greatly from the discovery.<\/p>", "q": "<p>Wells's patient in Boston felt no pain at all.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 1, "exp": "The patient 'later said he had felt little', not nothing, and he cried out during the procedure."}, {"type": "mc", "stem": "<p><b>Anaesthesia's dental origins<\/b><\/p>\n<p>Before the 1840s, surgery was performed on conscious patients, and speed was the surgeon's most prized skill. The first steps towards pain-free surgery came not from a hospital but from dentistry. In 1844 Horace Wells, a dentist in Connecticut, noticed that a man injured while under the influence of nitrous oxide, then popular as an entertainment known as 'laughing gas', seemed to feel no pain. Wells had one of his own teeth removed under the gas the next day and reported feeling nothing.<\/p>\n<p>Wells's public demonstration in Boston the following year went badly: the patient cried out, and the audience declared the method a fraud. The patient later said he had felt little, but the damage to Wells's reputation was done. In October 1846, William Morton, a former associate of Wells, used ether during an operation at Massachusetts General Hospital. This demonstration was judged a success, and news of it spread to Europe within months.<\/p>\n<p>The question of who deserved credit led to bitter disputes. Several men, including Wells and Morton, claimed priority, and none of them profited greatly from the discovery.<\/p>", "q": "<p>Morton was in the audience at Wells's Boston demonstration.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 2, "exp": "The passage says Morton was a former associate of Wells, but not whether he attended the Boston demonstration."}, {"type": "mc", "stem": "<p><b>Anaesthesia's dental origins<\/b><\/p>\n<p>Before the 1840s, surgery was performed on conscious patients, and speed was the surgeon's most prized skill. The first steps towards pain-free surgery came not from a hospital but from dentistry. In 1844 Horace Wells, a dentist in Connecticut, noticed that a man injured while under the influence of nitrous oxide, then popular as an entertainment known as 'laughing gas', seemed to feel no pain. Wells had one of his own teeth removed under the gas the next day and reported feeling nothing.<\/p>\n<p>Wells's public demonstration in Boston the following year went badly: the patient cried out, and the audience declared the method a fraud. The patient later said he had felt little, but the damage to Wells's reputation was done. In October 1846, William Morton, a former associate of Wells, used ether during an operation at Massachusetts General Hospital. This demonstration was judged a success, and news of it spread to Europe within months.<\/p>\n<p>The question of who deserved credit led to bitter disputes. Several men, including Wells and Morton, claimed priority, and none of them profited greatly from the discovery.<\/p>", "q": "<p>Which statement is best supported by the passage?<\/p>", "opts": ["Morton was trained as a dentist by Wells.", "Nitrous oxide was first used medically in a hospital.", "Several people disputed who should be credited with the discovery.", "Ether was abandoned soon after 1846."], "ans": 2, "exp": "The final paragraph describes bitter disputes over priority. The passage says Morton was a former associate, not that Wells trained him."}, {"type": "mc", "stem": "<p><b>Urban trees and summer heat<\/b><\/p>\n<p>Cities are often several degrees warmer than the surrounding countryside, an effect known as the urban heat island. Dark surfaces such as roads and roofs absorb sunlight during the day and release heat at night, while buildings trap warm air and reduce wind. Trees counter this in two ways: their canopies shade the ground, and water evaporating from their leaves cools the surrounding air.<\/p>\n<p>A study of one European city found that streets with dense tree cover were up to 4°C cooler at street level on hot afternoons than nearby streets without trees. The researchers cautioned, however, that the cooling effect was much smaller at night, and that narrow streets lined with large trees could trap vehicle pollution beneath the canopy.<\/p>\n<p>Planting trees is not always straightforward. Underground cables and pipes limit where roots can grow, and young trees need regular watering for several years. Some councils have found that a large share of newly planted street trees die within five years when maintenance budgets are cut.<\/p>", "q": "<p>Trees cool cities only by providing shade.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 1, "exp": "The passage gives two ways: shade and evaporation from leaves."}, {"type": "mc", "stem": "<p><b>Urban trees and summer heat<\/b><\/p>\n<p>Cities are often several degrees warmer than the surrounding countryside, an effect known as the urban heat island. Dark surfaces such as roads and roofs absorb sunlight during the day and release heat at night, while buildings trap warm air and reduce wind. Trees counter this in two ways: their canopies shade the ground, and water evaporating from their leaves cools the surrounding air.<\/p>\n<p>A study of one European city found that streets with dense tree cover were up to 4°C cooler at street level on hot afternoons than nearby streets without trees. The researchers cautioned, however, that the cooling effect was much smaller at night, and that narrow streets lined with large trees could trap vehicle pollution beneath the canopy.<\/p>\n<p>Planting trees is not always straightforward. Underground cables and pipes limit where roots can grow, and young trees need regular watering for several years. Some councils have found that a large share of newly planted street trees die within five years when maintenance budgets are cut.<\/p>", "q": "<p>The study found tree-lined streets were cooler at night by up to 4°C.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 1, "exp": "The 4°C figure applied to hot afternoons; the night-time effect was 'much smaller'."}, {"type": "mc", "stem": "<p><b>Urban trees and summer heat<\/b><\/p>\n<p>Cities are often several degrees warmer than the surrounding countryside, an effect known as the urban heat island. Dark surfaces such as roads and roofs absorb sunlight during the day and release heat at night, while buildings trap warm air and reduce wind. Trees counter this in two ways: their canopies shade the ground, and water evaporating from their leaves cools the surrounding air.<\/p>\n<p>A study of one European city found that streets with dense tree cover were up to 4°C cooler at street level on hot afternoons than nearby streets without trees. The researchers cautioned, however, that the cooling effect was much smaller at night, and that narrow streets lined with large trees could trap vehicle pollution beneath the canopy.<\/p>\n<p>Planting trees is not always straightforward. Underground cables and pipes limit where roots can grow, and young trees need regular watering for several years. Some councils have found that a large share of newly planted street trees die within five years when maintenance budgets are cut.<\/p>", "q": "<p>Most newly planted street trees in the UK die within five years.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 2, "exp": "The passage mentions 'some councils' finding a large share die when budgets are cut; it gives no UK-wide figure."}, {"type": "mc", "stem": "<p><b>Urban trees and summer heat<\/b><\/p>\n<p>Cities are often several degrees warmer than the surrounding countryside, an effect known as the urban heat island. Dark surfaces such as roads and roofs absorb sunlight during the day and release heat at night, while buildings trap warm air and reduce wind. Trees counter this in two ways: their canopies shade the ground, and water evaporating from their leaves cools the surrounding air.<\/p>\n<p>A study of one European city found that streets with dense tree cover were up to 4°C cooler at street level on hot afternoons than nearby streets without trees. The researchers cautioned, however, that the cooling effect was much smaller at night, and that narrow streets lined with large trees could trap vehicle pollution beneath the canopy.<\/p>\n<p>Planting trees is not always straightforward. Underground cables and pipes limit where roots can grow, and young trees need regular watering for several years. Some councils have found that a large share of newly planted street trees die within five years when maintenance budgets are cut.<\/p>", "q": "<p>Which is given as a possible drawback of large street trees?<\/p>", "opts": ["They make streets warmer at night.", "They can trap traffic pollution in narrow streets.", "They damage roads by absorbing sunlight.", "They increase wind speed between buildings."], "ans": 1, "exp": "The researchers cautioned that narrow streets with large trees could trap vehicle pollution."}, {"type": "mc", "stem": "<p><b>The Broad Street pump<\/b><\/p>\n<p>In the summer of 1854 a severe outbreak of cholera struck the Soho district of London, killing hundreds of people within a few weeks. At the time, most doctors believed diseases like cholera spread through 'miasma', a poisonous vapour rising from rotting matter.<\/p>\n<p>John Snow, a London physician, doubted this theory. By mapping the homes of people who had died, he showed that deaths clustered around a water pump on Broad Street. Some of his most persuasive evidence came from exceptions: workers at a nearby brewery, who drank beer supplied by their employer rather than pump water, largely escaped the disease, while a woman who lived some distance away died after having water from the Broad Street pump brought to her house because she preferred its taste.<\/p>\n<p>Snow persuaded the local authorities to remove the pump's handle. The outbreak was already declining by then, so the removal itself may have had limited effect. Nevertheless, his investigation is often described as a founding moment of epidemiology, although the miasma theory was not abandoned for some years.<\/p>", "q": "<p>Snow's map showed that deaths were concentrated around the Broad Street pump.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 0, "exp": "He showed that deaths clustered around the pump."}, {"type": "mc", "stem": "<p><b>The Broad Street pump<\/b><\/p>\n<p>In the summer of 1854 a severe outbreak of cholera struck the Soho district of London, killing hundreds of people within a few weeks. At the time, most doctors believed diseases like cholera spread through 'miasma', a poisonous vapour rising from rotting matter.<\/p>\n<p>John Snow, a London physician, doubted this theory. By mapping the homes of people who had died, he showed that deaths clustered around a water pump on Broad Street. Some of his most persuasive evidence came from exceptions: workers at a nearby brewery, who drank beer supplied by their employer rather than pump water, largely escaped the disease, while a woman who lived some distance away died after having water from the Broad Street pump brought to her house because she preferred its taste.<\/p>\n<p>Snow persuaded the local authorities to remove the pump's handle. The outbreak was already declining by then, so the removal itself may have had limited effect. Nevertheless, his investigation is often described as a founding moment of epidemiology, although the miasma theory was not abandoned for some years.<\/p>", "q": "<p>Removing the pump handle ended the outbreak.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 2, "exp": "The outbreak was already declining, so the removal 'may have had limited effect'. The passage doesn't say what ended it."}, {"type": "mc", "stem": "<p><b>The Broad Street pump<\/b><\/p>\n<p>In the summer of 1854 a severe outbreak of cholera struck the Soho district of London, killing hundreds of people within a few weeks. At the time, most doctors believed  "Other factors may have influenced the results.", "Customer-support staff preferred the new rota.", "The trial proved that shorter weeks reduce stress."], "ans": 1, "exp": "He acknowledged that other changes, such as new software, may have affected the results."}, {"type": "mc", "stem": "<p><b>A brief history of the toothbrush<\/b><\/p>\n<p>People have cleaned their teeth for thousands of years. Early methods included chewing the frayed ends of twigs from aromatic trees, a practice that continues in parts of Africa, the Middle East and South Asia today. Brushes with bristles set into a handle of bone or bamboo were in use in China by the fifteenth century, using coarse hair from pigs.<\/p>\n<p>In England, William Addis is often credited with the first mass-produced toothbrush. According to a frequently repeated story, he came up with the idea while in prison around 1780, drilling holes in a piece of bone and threading bristles through them. Whether the prison story is true is uncertain, but the company he founded made toothbrushes for more than two centuries.<\/p>\n<p>Animal bristles had drawbacks: they dried slowly and could harbour bacteria. Nylon bristles, introduced in the late 1930s, solved these problems and were cheaper. Even so, regular toothbrushing did not become common in many countries until the mid-twentieth century.<\/p>", "q": "<p>The company William Addis founded still makes toothbrushes today.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 2, "exp": "It 'made toothbrushes for more than two centuries', which doesn't say whether it still does."}, {"type": "mc", "stem": "<p><b>A brief history of the toothbrush<\/b><\/p>\n<p>People have cleaned their teeth for thousands of years. Early methods included chewing the frayed ends of twigs from aromatic trees, a practice that continues in parts of Africa, the Middle East and South Asia today. Brushes with brist ia. Nylon bristles, introduced in the late 1930s, solved these problems and were cheaper. Even so, regular toothbrushing did not become common in many countries until the mid-twentieth century.<\/p>", "q": "<p>Nylon bristles dried faster than animal bristles.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 0, "exp": "Nylon 'solved these problems', one of which was that animal bristles dried slowly."}, {"type": "mc", "stem": "<p><b>A brief history of the toothbrush<\/b><\/p>\n<p>People have cleaned their teeth for thousands of years. Early methods included chewing the frayed ends of twigs from aromatic trees, a practice that continues in parts of Africa, the Middle East and South Asia today. Brushes with bristles set into a handle of bone or bamboo were in use in China by the fifteenth century, using coarse hair from pigs.<\/p>\n<p>In England, William Addis is often credited with the first mass-produced toothbrush. According to a frequently repeated story, he came up with the idea while in prison around 1780, drilling holes in a piece of bone and threading bristles through them. Whether the prison story is true is uncertain, but the company he founded made toothbrushes for more than two centuries.<\/p>\n<p>Animal bristles had drawbacks: they dried slowly and could harbour bacteria. Nylon bristles, introduced in the late 1930s, solved these problems and were cheaper. Even so, regular toothbrushing did not become common in many countries until the mid-twentieth century.<\/p>", "q": "<p>According to the passage, when did regular toothbrushing become common in many countries?<\/p>", "opts": ["In the fifteenth century", "Around 1780", "In the late 1930s", "In the mid-twentieth century"], "ans": 3, "exp": "The final sentence says it was not common until the mid-twentieth century."}, {"type": "mc", "stem": "<p><b>The year without a summer<\/b><\/p>\n<p>In April 1815 Mount Tambora, a volcano in what is now Indonesia, erupted with enormous force. Tens of thousands of people on the surrounding islands died, from the eruption itself and from the famine that followed. The eruption also sent vast quantities of sulphur gas high into the atmosphere, where it formed a haze of tiny droplets that reflected sunlight back into space.<\/p>\n<p>The following year, 1816, became known in Europe and North America as 'the year without a summer'. Snow fell in parts of New England in June, and crops failed across much of northern Europe, causing food prices to soar. Historians have linked the hardship to migration, unrest and the spread of disease.<\/p>\n<p>At the time, no one connected the cold weather with an eruption on the other side of the world. The link was established by scientists only in the twentieth century, using records from ice cores and historical accounts.<\/p>", "q": "<p>The eruption caused deaths both directly and through famine.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 0, "exp": "Deaths came 'from the eruption itself and from the famine that followed'."}, {"type": "mc", "stem": "<p><b>The year without a summer<\/b><\/p>\n<p>In April 1815 Mount Tambora, a volcano in what is now Indonesia, erupted with enormous force. Tens of thousands of people on the surrounding islands died, from the eruption itself and from the famine that followed. The eruption also sent vast quantities of sulphur gas high into the atmosphere, where it formed a haze of tiny droplets that reflected sunlight back into space.<\/p>\n<p>The following year, 1816, became known in Europe and North America as 'the year without a summer'. Snow fell in parts of New England in June, and crops failed across much of northern Europe, causing food prices to soar. Historians have linked the hardship to migration, unrest and the spread of disease.<\/p>\n<p>At the time, no one connected amine that followed. The eruption also sent vast quantities of sulphur gas high into the atmosphere, where it formed a haze of tiny droplets that reflected sunlight back into space.<\/p>\n<p>The following year, 1816, became known in Europe and North America as 'the year without a summer'. Snow fell in parts of New England in June, and crops failed across much of northern Europe, causing food prices to soar. Historians have linked the hardship to migration, unrest and the spread of disease.<\/p>\n<p>At the time, no one connected the cold weather with an eruption on the other side of the world. The link was established by scientists only in the twentieth century, using records from ice cores and historical accounts.<\/p>", "q": "<p>How did the eruption cool the climate, according to the passage?<\/p>", "opts": ["Ash blocked out the sun for the whole of 1816.", "Sulphur droplets reflected sunlight back into space.", "Lava flows cooled the oceans.", "Snow from the volcano spread to New England."], "ans": 1, "exp": "The sulphur haze 'reflected sunlight back into space'."}, {"type": "mc", "stem": "<p><b>Microplastics<\/b><\/p>\n<p>Microplastics are fragments of plastic smaller than five millimetres. Some are made deliberately small, such as the beads once added to face scrubs, while most come from larger items breaking down through sunlight and wear. Washing synthetic clothing releases fibres, and car tyres shed tiny particles as they wear against the road.<\/p>\n<p>Microplastics have been found in seawater, soil, drinking water and the bodies of many animals. Researchers have also detected them in human tissue. What is far less clear is whether they cause harm at the levels people are exposed to. Laboratory studies have shown effects on cells, but often at concentrations much higher than those found in the environment.<\/p>\n<p>Measuring exposure is itself difficult. Plastic is everywhere in laboratories, so samples are easily contaminated, and different research groups  fibres, and car tyres shed tiny particles as they wear against the road.<\/p>\n<p>Microplastics have been found in seawater, soil, drinking water and the bodies of many animals. Researchers have also detected them in human tissue. What is far less clear is whether they cause harm at the levels people are exposed to. Laboratory studies have shown effects on cells, but often at concentrations much higher than those found in the environment.<\/p>\n<p>Measuring exposure is itself difficult. Plastic is everywhere in laboratories, so samples are easily contaminated, and different research groups use different methods, which makes their results hard to compare.<\/p>", "q": "<p>Car tyres are a larger source of microplastics than clothing.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 2, "exp": "Both are named as sources; the passage doesn't compare them."}, {"type": "mc", "stem": "<p><b>Microplastics<\/b><\/p>\n<p>Microplastics are fragments of plastic smaller than five millimetres. Some are made deliberately small, such as the beads once added to face scrubs, while most come from larger items breaking down through sunlight and wear. Washing synthetic clothing releases fibres, and car tyres shed tiny particles as they wear against the road.<\/p>\n<p>Microplastics have been found in seawater, soil, drinking water and the bodies of many animals. Researchers have also detected them in human tissue. What is far less clear is whether they cause harm at the levels people are exposed to. Laboratory studies have shown effects on cells, but often at concentrations much higher than those found in the environment.<\/p>\n<p>Measuring exposure is itself difficult. Plastic is everywhere in laboratories, so samples are easily contaminated, and different research groups use different methods, which makes their results hard to compare.<\/p>", "q": "<p>Why are results from different studies hard to compare?<\/p>", "opts": ["Microplastics break down too quickly to measure.", "Groups use different methods, and contamination is common.", "Laboratories are not allowed to use plastic.", "Most studies only test seawater."], "ans": 1, "exp": "The final paragraph cites contamination and differing methods."}, {"type": "mc", "stem": "<p><b>Bilingual brains<\/b><\/p>\n<p>For much of the twentieth century, parents in some countries were advised not to raise children with two languages, in the belief that it would confuse them and delay their speech. Later research overturned this view: children who grow up bilingual generally reach language milestones within the normal range, though each of their vocabularies may be smaller at first than a monolingual child's.<\/p>\n<p>More recently, some studies claimed that switching between languages strengthens 'executive function', the mental skills used to plan, focus and ignore distractions. This idea attracted widespread media coverage. However, larger and more carefully designed studies have often failed to find a clear advantage, and some researchers argue that early positive results were more likely to be published than negative ones.<\/p>\n<p>Few researchers dispute the practical benefits of speaking more than one language, from travel and work to family connections. The debate is about whether there is an extra cognitive bonus.<\/p>", "q": "<p>Bilingual children usually reach language milestones within the normal range.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 0, "exp": "Stated in the first paragraph."}, {"type": "mc", "stem": "<p><b>Bilingual brains<\/b><\/p>\n<p>For much of the twentieth century, parents in some countries were advised not to raise children with two languages, in the belief that it would confuse them and delay their speech. Later research overturned this view: children who grow up bilingual generally reach language milestones within the normal range, though each of their vocabularies may be smaller at first than a monolingual child's.<\/p>\n<p>More recently, some studies claimed that switching between languages strengthens 'executive function', the mental skills used to plan, focus and ignore distractions. This idea attracted widespread media coverage. However, larger and more carefully designed studies have often failed to find a clear advantage, and some researchers argue that early positive results were more likely to be published than negative ones.<\/p>\n<p>Few researchers dispute the practical benefits of speaking more than one language, from travel and work to family connections. The debate is about whether there is an extra cognitive bonus.<\/p>", "q": "<p>Larger studies have consistently confirmed a bilingual advantage in executive function.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 1, "exp": "They 'have often failed to find a clear advantage'."}, {"type": "mc", "stem": "<p><b>Bilingual brains<\/b><\/p>\n<p>For much of the twentieth century, parents in some countries were advised not to raise children with two languages, in the belief that it would confuse them and delay their speech. Later research overturned this view: children who grow up bilingual generally reach language milestones within the normal range, though each of their vocabularies may be smaller at first than a monolingual child's.<\/p>\n<p>More recently, some studies claimed that switching between languages strengthens 'executive function', the mental skills used to plan, focus and ignore distractions. This idea attracted widespread media coverage. However, larger and more carefully designed studies have often failed to find a clear advantage, and some researchers argue that early positive results were more likely to be published than negative ones.<\/p>\n<p>Few researchers dispute the practical benefits of speaking more than one language, from travel and work to family connections. The debate is about whether there is an extra cognitive bonus.<\/p>", "q": "<p>Bilingual children always know more words in total than monolingual children.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 2, "exp": "The passage says each vocabulary may be smaller at first; it doesn't compare total vocabularies."}, {"type": "mc", "stem": "<p><b>Bilingual brains<\/b><\/p>\n<p>For much of the twentieth century, parents in some countries were advised not to raise children with two languages, in the belief that it would confuse them and delay their speech. Later research overturned this view: children who grow up bilingual generally reach language milestones within the normal range, though each of their vocabularies may be smaller at first than a monolingual child's.<\/p>\n<p>More recently, some studies claimed that switching between languages strengthens 'executive function', the mental skills used to plan, focus and ignore distractions. This idea attracted widespread media coverage. However, larger and more carefully designed studies have often failed to find a clear advantage, and some researchers argue that early positive results were more likely to be published than negative ones.<\/p>\n<p>Few researchers dispute the practical benefits of speaking more than one language, from travel and work to family connections. The debate is about whether there is an extra cognitive bonus.<\/p>", "q": "<p>What is the main point of disagreement described in the passage?<\/p>", "opts": ["Whether bilingualism has practical benefits", "Whether bilingual children are confused", "Whether bilingualism gives an extra cognitive advantage", "Whether parents should teach two languages"], "ans": 2, "exp": "The last sentence: the debate is about 'an extra cognitive bonus'."}, {"type": "mc", "stem": "<p><b>Coral bleaching<\/b><\/p>\n<p>Reef-building corals live in partnership with microscopic algae that live inside their tissues. The algae provide much of the coral's energy through photosynthesis and give corals their colour. When the water becomes too warm for too long, this partnership breaks down: the coral expels the algae and turns white, a process called bleaching.<\/p>\n<p>Bleached corals are not dead. If temperatures return to normal quickly, the algae can recolonise and the coral can recover. If heat stress continues, however, many corals starve. Repeated bleaching events, with less time to recover between them, are now one of the greatest threats to reefs.<\/p>\n<p>Some coral species and individual colonies tolerate heat better than others, and scientists are studying whether more tolerant corals could be bred or transplanted. Most researchers say such efforts can buy time but will not save reefs on their own unless warming is limited.<\/p>", "q": "<p>Bleached corals are dead.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 1, "exp": "'Bleached corals are not dead.'"}, {"type": "mc", "stem": "<p><b>Coral bleaching<\/b><\/p>\n<p>Reef-building corals live in partnership with microscopic algae that live inside their tissues. The algae provide much of the coral's energy through photosynthesis and give corals their colour. When the water becomes too warm for too long, this partnership breaks down: the coral expels the algae and turns white, a process called bleaching.<\/p>\n<p>Bleached corals are not dead. If temperatures return to normal quickly, the algae can recolonise and the coral can recover. If heat stress continues, however, many corals starve. Repeated bleaching events, with less time to recover between them, are now one of the greatest threats to reefs.<\/p>\n<p>Some coral species and individual colonies tolerate heat better than others, and scientists are studying whether more tolerant corals could be bred or transplanted. Most researchers say such efforts can buy time but will not save reefs on their own unless warming is limited.<\/p>", "q": "<p>The algae give corals their colour.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 0, "exp": "Stated in the first paragraph."}, {"type": "mc", "stem": "<p><b>Coral bleaching<\/b><\/p>\n<p>Reef-building corals live in partnership with microscopic algae that live inside their tissues. The algae provide much of the coral's energy through photosynthesis and give corals their colour. When the water becomes too warm for too long, this partnership breaks down: the coral expels the algae and turns white, a process called bleaching.<\/p>\n<p>Bleached corals are not dead. If temperatures return to normal quickly, the algae can recolonise and the coral can recover. If heat stress continues, however, many corals starve. Repeated bleaching events, with less time to recover between them, are now one of the greatest threats to reefs.<\/p>\n<p>Some coral species and individual colonies tolerate heat better than others, and scientists are studying whether more tolerant corals could be bred or transplanted. Most researchers say such efforts can buy time but will not save reefs on their own unless warming is limited.<\/p>", "q": "<p>Most researchers think breeding heat-tolerant corals could save reefs on its own.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 1, "exp": "Most researchers say such efforts 'will not save reefs on their own unless warming is limited'."}, {"type": "mc", "stem": "<p><b>Coral bleaching<\/b><\/p>\n<p>Reef-building corals live in partnership with microscopic algae that live inside their tissues. The algae provide much of the coral's energy through photosynthesis and give  is small within the council's overall budget is a false economy.<\/p>", "q": "<p>The author believes falling visitor numbers are partly caused by reduced opening hours.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 0, "exp": "'It is hardly surprising that fewer people visit a building that is rarely open.'"}, {"type": "mc", "stem": "<p><b>The local library<\/b><\/p>\n<p>The council's plan to close the Elm Road library and replace it with a 'digital hub' in the town centre has been presented as modernisation. It is nothing of the kind. Visitor numbers have fallen, the council says, yet it has cut opening hours three times in five years. It is hardly surprising that fewer people visit a building that is rarely open.<\/p>\n<p>The library is not just a store of books. It is the only free, warm, indoor space in the area where people can sit without buying anything. Older residents attend its reading groups; parents bring toddlers to rhyme time; students without quiet space at home study there in the evenings. A digital hub two bus rides away will not serve these people.<\/p>\n<p>Of course the council faces real budget pressures, and nobody expects services to be immune. But cutting a well-used community space to save a sum that is small within the council's overall budget is a false economy.<\/p>", "q": "<p>The author thinks the council has no budget pressures.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 1, "exp": "The author says 'the council faces real budget pressures'."}, {"type": "mc", "stem": "<p><b>The local library<\/b><\/p>\n<p>The council's plan to close the Elm Road library and replace it with a 'digital hub' in the town centre has been presented as modernisation. It is nothing of the kind. Visitor numbers have fallen, the council says, yet it has cut opening hours three times in five years. It is hardly surprising that fewer people visit a building that is rarely open.<\/p>\n<p>The library is not just a store of books. It is the only free, warm, indoor space in the area where people can sit without buying anything. Older residents attend its reading groups; parents bring toddlers to rhyme time; students without quiet space at home study there in the evenings. A digital hub two bus rides away will not serve these people.<\/p>\n<p>Of course the council faces real budget pressures, and nobody expects services to be immune. But cutting a well-used community space to save a sum that is small within the council's overall budget is a false economy.<\/p>", "q": "<p>The digital hub will offer reading groups for older residents.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 2, "exp": "The passage doesn't say what services the hub will offer."}, {"type": "mc", "stem": "<p><b>The local library<\/b><\/p>\n<p>The council's plan to close the Elm Road library and replace it with a 'digital hub' in the town centre has been presented as modernisation. It is nothing of the kind. Visitor numbers have fallen, the council says, yet it has cut opening hours three times in five years. It is hardly surprising that fewer people visit a building that is rarely open.<\/p>\n<p>The library is not just a store of books. It is the only free, warm, indoor space in the area where people can sit without buying anything. Older residents attend its reading groups; parents bring toddlers to rhyme time; students without quiet space at home study there in the evenings. A digital hub two bus rides away will not serve these people.<\/p>\n<p>Of course the council faces real budget pressures, and nobody expects services to be immune. But cutting a well-used community space to save a sum that is small within the council's overall budget is a false economy.<\/p>", "q": "<p>Which best describes the author's view?<\/p>", "opts": ["Libraries should be replaced by digital services.", "Closing the library is a false economy that would harm local people.", "The council should raise taxes to fund libraries.", "Visitor numbers prove the library is no longer needed."], "ans": 1, "exp": "The author argues the closure would harm users and calls it a false economy."}, {"type": "mc", "stem": "<p><b>The placebo effect<\/b><\/p>\n<p>A placebo is a treatment with no active ingredient, such as a sugar pill. Patients who receive placebos in clinical trials often report improvements, particularly in symptoms such as pain, nausea and tiredness. This is why new drugs are usually tested against a placebo rather than against no treatment at all.<\/p>\n<p>Part of the apparent placebo effect is not caused by the placebo at all. Many conditions improve naturally over time, and symptoms that are unusually bad when someone enrols in a trial tend to be less severe later, a statistical effect called regression to the mean. However, studies have shown that expectations can genuinely change how pain is experienced, so some of the effect is real.<\/p>\n<p>Surprisingly, some studies have found that placebos can help even when patients are told they are taking a placebo. These 'open-label' studies have mostly been small, and researchers disagree about how widely the results apply.<\/p>", "q": "<p>New drugs are usually compared with a placebo rather than with no treatment.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 0, "exp": "Stated in the first paragraph."}, {"type": "mc", "stem": "<p><b>The placebo effect<\/b><\/p>\n<p>A placebo is a treatment with no active ingredient, such as a sugar pill. Patients who receive placebos in clinical trials often report improvements, particularly in symptoms such as pain, nausea and tiredness. This is why new drugs are usually tested against a placebo rather than against no treatment at all.<\/p>\n<p>Part of the apparent placebo effect is not caused by the placebo at all. Many conditions improve naturally over time, and symptoms that are unusually bad when someone enrols in a trial tend to be less severe later, a statistical effect called regression to the mean. However, studies have shown that expectations can genuinely change how pain is experienced, so some of the effect is real.<\/p>\n<p>Surprisingly, some studies have found that placebos can help even when patients are told they are taking a placebo. These 'open-label' studies have mostly been small, and researchers disagree about how widely the results apply.<\/p>", "q": "<p>The whole of the placebo effect is caused by regression to the mean.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 1, "exp": "Some of the effect is real, because expectations can change pain."}, {"type": "mc", "stem": "<p><b>The placebo effect<\/b><\/p>\n<p>A placebo is a treatment with no active ingredient, such as a sugar pill. Patients who receive placebos in clinical trials often report improvements, particularly in symptoms such as pain, nausea and tiredness. This is why new drugs are usually tested against a placebo rather than against no treatment at all.<\/p>\n<p>Part of the apparent placebo effect is not caused by the placebo at all. Many conditions improve naturally over time, and symptoms that are unusually bad when someone enrols in a trial tend to be less severe later, a statistical effect called regression to the mean. However, studies have shown that expectations can genuinely change how pain is experienced, so some of the effect is real.<\/p>\n<p>Surprisingly, some studies have found that placebos can help even when patients are told they are taking a placebo. These 'open-label' studies have mostly been small, and researchers disagree about how widely the results apply.<\/p>", "q": "<p>Open-label placebos work better for pain than for nausea.<\/p><p class='muted' style='font-weight:500;font-size:0.88rem'>True, False or Can't tell?<\/p>", "opts": ["True", "False", "Can't tell"], "ans": 2, "exp": "Pain and nausea are mentioned for placebos in trials generally; the passage doesn't compare conditions for open-label studies."}, {"type": "mc", "stem": "<p><b>The placebo effect<\/b><\/p>\n<p>A placebo is a treatment with no active ingredient, such as a sugar pill. Patients who receive placebos in clinical trials often report improvements, particularly in symptoms such as pain, nausea and tiredness. This is why new drugs are usually tested against a placebo rather than against no treatment at all.<\/p>\n<p>Part of the apparent placebo effect is not caused by the placebo at all. Many conditions improve naturally over time, and symptoms that are unusually bad when someone enrols in a trial tend to be less severe later, a statistical effect called regression to the mean. However, studies have shown that expectations can genuinely change how pain is experienced, so some of the effect is real.<\/p>\n<p>Surprisingly, some studies have found that placebos can help even when patients are told they are taking a placebo. These 'open-label' studies have mostly been small, and researchers disagree about how widely the results apply.<\/p>", "q": "<p>Which conclusion is best supported by the passage?<\/p>", "opts": ["Placebos cure most illnesses.", "Some improvement seen with placebos would have happened anyway.", "Patients must never be told they are taking a placebo.", "Placebos work best for broken bones."], "ans": 1, "exp": "Natural improvement and regression to the mean explain part of the apparent effect."}]}, {"key": "dm", "name": "Decision Making", "minutes": 37, "intro": "<p>Logic puzzles, syllogisms, Venn diagrams, probability, interpreting data and choosing the strongest argument.<\/p><p>For <b>Yes/No<\/b> questions, decide f  are first-aiders. All first-aiders are hygienists. Some first-aiders are volunteers.<\/p><p>Place 'Yes' if the conclusion follows from the statements, or 'No' if it does not.<\/p>", "statements": ["No hygienists are first-aiders.", "Some volunteers are hygienists.", "Some hygienists are not volunteers.", "Some volunteers are first-aiders.", "All volunteers are first-aiders."], "answers": [false, true, false, true, false], "exp": "Remember: 'some' means at least one, and possibly all.<br><b>No<\/b>: No hygienists are first-aiders; some hygienists could also be first-aiders.<br><b>Yes<\/b>: Some volunteers are hygienists; this is true in every situation the statements allow.<br><b>No<\/b>: Some hygienists are not volunteers; it's possible that all hygienists are volunteers.<br><b>Yes<\/b>: Some volunteers are first-aiders; this is true in every situation the statements allow.<br><b>No<\/b>: All volunteers are first-aiders; there could be volunteers who are not first-aiders."}, {"type": "mc", "stem": null, "q": "A box holds 4 red and 6 blue mouthguards. Two are taken at random without replacement. What is the probability both are red?", "opts": ["2/15", "4/25", "1/3", "2/5"], "ans": 0, "exp": "4/10 × 3/9 = 2/15. With replacement it would be (4/10)² = 4/25."}, {"type": "mc", "stem": "<p>A group of Year 12 students: the diagram shows how many study each combination.<\/p><svg viewBox=\"0 0 380 310\" role=\"img\" aria-label=\"Venn diagram\"><circle cx=\"150\" cy=\"120\" r=\"82\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.5\"/><circle cx=\"230\" cy=\"120\" r=\"82\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.5\"/><circle cx=\"190\" cy=\"190\" r=\"82\" fill=\"none\" stroke=\"#888\" stroke-width=\"1.5\"/><text x=\"110\" y=\"100\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\">5<\/text><text x=\"270\" y=\"100\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\">10<\/text><text x=\"190\" y=\"240\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\">2<\/text><text x=\"190\" y=\"92\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\">9<\/text><text x=\"140\" y=\"180\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\">8<\/text><text x=\"240\" y=\"180\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\">6<\/text><text x=\"190\" y=\"148\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\">11<\/text><text x=\"70\" y=\"36\" font-size=\"13\">Biology<\/text><text x=\"250\" y=\"36\" font-size=\"13\">Chemistry<\/text><text x=\"190\" y=\"300\" text-anchor=\"middle\" font-size=\"13\">Maths<\/text><text x=\"360\" y=\"292\" text-anchor=\"end\" font-size=\"12\">Neither/none: 4<\/text><\/svg>", "q": "How many study only one of the three?", "opts": ["14", "17", "21", "28"], "ans": 1, "exp": "Add the right regions of the diagram: the answer is 17. Check which regions are inside or outside each circle before adding."}, {"type": "yn", "stem": null, "q": "<p>No applicants are athletes. All debaters are applicants. Some debaters are applicants.<\/p><p>Place 'Yes' if the conclusion follows from the statements, or 'No' if it does not.<\/p>", "statements": ["Some applicants are debaters.", "Some athletes are not debaters.", "Some athletes are not applicants.", "Some applicants are athletes.", "Some applicants are not athletes."], "answers": [true, true, true, false, true], "exp": "Remember: 'some' means at least one, and possibly all.<br><b>Yes<\/b>: Some applicants are debaters; this is true in every situation the statements allow.<br><b>Yes<\/b>: Some athletes are not debaters; this is true in every situation the statements allow.<br><b>Yes<\/b>: Some athletes are not applicants; this is true in every situation the statements allow.<br><b>No<\/b>: Some applicants are athletes; it's possible that no applicants are athletes.<br><b>Yes<\/b>: Some applicants are not athletes; this is true in every situation the statements allow."}, {"type": "mc", "stem": null, "q": "<p>Five dental chairs in a  × £29.99 = £89.97."}, {"type": "mc", "stem": "<p>A dental surgery measuring <b>4.8 m × 3.0 m<\/b> with walls <b>2.5 m<\/b> high is being repainted.<\/p><ul><li>One door (1.8 m²) and one window (2.4 m²) are not painted.<\/li><li>Paint covers <b>12 m² per litre<\/b> per coat; two coats are needed.<\/li><li>Paint is sold in <b>2.5-litre tins<\/b> at <b>£29.99<\/b> each. The ceiling is not painted.<\/li><\/ul>", "q": "How much paint will be left over?", "opts": ["1.70 litres", "3.30 litres", "3.40 litres", "4.20 litres", "7.50 litres"], "ans": 0, "exp": "Bought 3 × 2.5 = 7.5 L; used 5.80 L; left 1.70 L."}, {"type": "mc", "stem": "<p><b>Morning trains from Derby to Nottingham (64 miles by rail). Anytime return £18.40; railcard saves one third.<\/b><\/p><table><tr><th>Departs Derby<\/th><th>Journey time<\/th><th>Arrives Nottingham<\/th><\/tr><tr><td>06:25<\/td><td>51 min<\/td><td>07:16<\/td><\/tr><tr><td>07:10<\/td><td>51 min<\/td><td>08:01<\/td><\/tr><tr><td>08:10<\/td><td>47 min<\/td><td>08:57<\/td><\/tr><tr><td>08:20<\/td><td>42 min<\/td><td>09:02<\/td><\/tr><\/table>", "q": "What is the average speed of the fastest train? (nearest mph)", "opts": ["70 mph", "75 mph", "82 mph", "91 mph", "152 mph"], "ans": 3, "exp": "Fastest journey 42 min = 0.700 h. Speed = 64 ÷ 0.700 ≈ 91 mph."}, {"type": "mc", "stem": "<p><b>Morning trains from Derby to Nottingham (64 miles by rail). Anytime return £18.40; railcard saves one third.<\/b><\/p><table><tr><th>Departs Derby<\/th><th>Journey time<\/th><th>Arrives Nottingham<\/th><\/tr><tr><td>06:25<\/td><td>51 min<\/td><td>07:16<\/td><\/tr><tr><td>07:10<\/td><td>51 min<\/td><td>08:01<\/td><\/tr><tr><td>08:10<\/td><td>47 min<\/td><td>08:57<\/td><\/tr><tr><td>08:20<\/td><td>42 min<\/td><td>09:02<\/td><\/tr><\/table>", "q": "4 people, each with a railcard, buy anytime returns. What is the total cost?", "opts": ["£12.27", "£24.53", "£49.07", "£53.97", "£73.60"], "ans": 2, "exp": "Railcard fare = £18.40 × ⅔ = £12.27; × 4 = £49.07. A third OFF
